<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Экипировка воина — WoW 3.3.5a</title><link rel="stylesheet" href="assets/css/app.css">
<style>
main.gear-main{gap:12px;overflow:hidden}.gear-head{display:flex;align-items:center;gap:14px;flex:0 0 auto}.gear-head img{width:58px;height:58px;border:2px solid var(--gold);border-radius:11px}.gear-head h1{font-size:clamp(22px,2.3vw,32px);color:var(--gold2)}.gear-head p{font-size:14px;color:var(--dim);margin-top:4px}
.gear-layout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:1;min-height:0}.gear-path{--accent:var(--gold2);display:flex;flex-direction:column;gap:10px;min-width:0;padding:16px;background:linear-gradient(150deg,#20232c,#11141c);border:1px solid #665633;border-radius:14px;overflow:hidden}.gear-path h2{font-size:19px;color:var(--accent)}.gear-path p{font-size:13px;line-height:1.5;color:#cac7bf}.gear-priority{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.stat{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #ffffff12;border-radius:9px;background:#080a109c;font-size:13px}.stat img{width:30px;height:30px;border-radius:6px}.stat b{color:var(--gold2)}.gear-path .sources{margin-top:auto;padding-top:8px;border-top:1px solid #ffffff1b;font-size:12px;line-height:1.8}.gear-path a{color:#d6bd78;text-decoration:none}.gear-path a:hover{text-decoration:underline}
@media(max-width:800px){.gear-layout{grid-template-columns:minmax(0,1fr)}.gear-path{display:none;padding:11px}.gear-path.active{display:flex}.gear-head p{font-size:12px}.stat{font-size:11px}.stat img{width:24px;height:24px}}
</style></head><body><div id="app"><main class="gear-main"><section class="gear-head"><img id="gearIcon" src="https://wow.zamimg.com/images/wow/icons/large/ability_racial_avatar.jpg" alt=""><div><h1 id="gearTitle">Экипировка воина</h1><p id="gearSub">Ориентиры для прокачки и подбора вещей на 80-м уровне</p></div></section><section class="gear-layout" id="gearLayout"></section></main></div><script src="assets/js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const lang=window.W.lang,ru=lang==='ru',spec=new URLSearchParams(location.search).get('spec')||localStorage.getItem('warriorSpec')||'fury';const defs=[
{id:'arms',name:'Arms · PvP',icon:'ability_rogue_eviscerate',brief:ru?'Балансируй давление и устойчивость. В PvP сила сама по себе не заменяет выживаемость и контроль.':'Balance pressure and resilience; raw strength does not replace survivability and control.',stats:[['strength','Сила','Strength'],['inv_shoulder_22','Устойчивость','Resilience'],['inv_sword_20','Меткость','Hit'],['ability_criticalstrike','Критический удар','Critical strike']],order:ru?'Сначала набери комфортную меткость для своего сервера, затем сочетай силу и устойчивость под состав арены. Выбирай оружие с высоким уроном оружия: от него зависят удары Arms.':'Reach comfortable hit for your realm, then balance strength and resilience for your arena comp. Prioritize high weapon damage; Arms abilities scale with weapon damage.',links:[['Warcraft Tavern · Arms PvP','https://www.warcrafttavern.com/wotlk/guides/pvp-arms-warrior-rotation-cooldowns-abilities/'],['Icy Veins · Arms PvP','https://www.icy-veins.com/wotlk-classic/arms-warrior-pvp-guide']]},
{id:'fury',name:'Fury · PvE ДД',icon:'ability_racial_avatar',brief:ru?'Для рейда собирай силу атаки и крит, доводи меткость и мастерство до нужного значения. Два медленных двуручных — цель Хватки титана.':'For raids, build attack power and crit while meeting hit and expertise needs. Titan’s Grip makes two slow two-handers the endgame goal.',stats:[['inv_shoulder_22','Сила','Strength'],['inv_axe_66','Меткость','Hit'],['ability_criticalstrike','Критический удар','Critical strike'],['inv_misc_gear_06','Мастерство','Expertise']],order:ru?'До 80-го носи вещи с лучшим уроном и основными характеристиками; не ломай комплект ради одной характеристики. На 80-м сверяй пороги меткости/мастерства и симуляцию для экипировки своего сервера.':'While leveling, use the best weapon damage and core stats available. At 80, check hit/expertise caps and gear sim results for your realm before trading a full set for one stat.',links:[['Wowhead · Fury DPS','https://www.wowhead.com/wotlk/guide/classes/warrior/fury/dps-rotation-cooldowns-abilities-pve'],['Warcraft Tavern · Fury','https://www.warcrafttavern.com/wotlk/guides/pve-fury-warrior-rotation-cooldowns/'],['Icy Veins · Fury','https://www.icy-veins.com/wotlk-classic/fury-warrior-dps-pve-rotation-cooldowns-abilities']]},
{id:'prot',name:'Protection · PvE танк',icon:'ability_warrior_defensivestance',brief:ru?'Подбирай защиту под входящий урон, не теряя угрозу. Для рейда ориентируйся на защиту и здоровье, для данжей ценна скорость набора угрозы.':'Tune mitigation to incoming damage without losing threat. Raid sets emphasize defense and health; dungeons reward reliable threat generation.',stats:[['inv_shield_05','Защита','Defense'],['inv_shirt_06','Выносливость','Stamina'],['ability_warrior_shieldslam','Блок и броня','Block & armor'],['ability_warrior_revenge','Меткость / мастерство','Hit / expertise']],order:ru?'Собери требуемую защиту, затем здоровье и снижение физического урона. Проверяй меткость, мастерство и таблицу атак босса: подход зависит от контента и настроек сервера.':'Reach the required defense, then health and physical mitigation. Check hit, expertise, boss attack tables, and realm tuning; exact targets depend on content.',links:[['Warcraft Tavern · Protection','https://www.warcrafttavern.com/wotlk/guides/pve-protection-warrior-tank-rotations-cooldowns/'],['Icy Veins · Protection','https://www.icy-veins.com/wotlk-classic/protection-warrior-tank-pve-guide']]}
];const selected=defs.find(x=>x.id===spec)||defs[1];document.getElementById('gearTitle').textContent=ru?'Экипировка · '+selected.name:'Gear · '+selected.name;document.getElementById('gearIcon').src=window.W.icon(selected.icon);document.getElementById('gearSub').textContent=ru?'Приоритеты характеристик и выбор вещей для этого пути':'Stat priorities and gearing notes for this path';document.title=selected.name+' — Gear';document.getElementById('gearLayout').innerHTML=defs.map(d=>`<article class="gear-path ${d.id===selected.id?'active':''}" style="--accent:${d.id===spec?'#e8c96a':'#b8b2a5'}"><h2>${d.name}</h2><p>${d.brief}</p><div class="gear-priority">${d.stats.map(s=>`<div class="stat"><img src="${window.W.icon(s[0])}" alt=""><b>${ru?s[1]:s[2]}</b></div>`).join('')}</div><p>${d.order}</p><div class="sources">${d.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noreferrer">${l[0]}</a>`).join('<br>')}</div></article>`).join('')});
</script></body></html>
