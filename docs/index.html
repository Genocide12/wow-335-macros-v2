<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WoW 3.3.5 · Fury Warrior — умные макросы</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .hero-grid { grid-template-columns: 1fr; grid-template-rows: 1fr; overflow:hidden; }
  .hero-main { position:relative; display:flex; flex-direction:column; justify-content:center; gap:14px; overflow:hidden;
    max-width:none; width:100%; height:100%; margin:0 auto; padding:clamp(24px,5vw,62px); min-height:0;
    background:linear-gradient(90deg,rgba(10,12,18,.93),rgba(10,12,18,.58) 58%,rgba(10,12,18,.25)),url('assets/icons/bg/164.jpg') center 42%/cover; border-color:#75602e; }
  .hero-main h1 { font-size: clamp(28px, 4.6vw, 48px); line-height: 1.08; color: #fff; }
  .hero-main h1 b { color: var(--gold2); }
  .hero-main p { color:#c7c4bd; font-size:15px; max-width:58ch; line-height:1.55; }
  .cta { display: flex; gap: 10px; flex-wrap: wrap; }
  .krow { display: flex; gap: 8px; flex-wrap: wrap; }
  .krow a { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; color: var(--txt); text-decoration: none; font-size: 13px; font-weight: 600; }
  .krow a:hover { border-color: var(--gold); }
  .krow img { width: 26px; height: 26px; border-radius: 6px; }
  .krow .key { display: inline-flex; width: 22px; height: 22px; border-radius: 6px; background: #0a0c12;
    border: 1px solid var(--gold); color: var(--gold2); align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .macro-dropdown{display:none;position:absolute;z-index:8;left:clamp(20px,5vw,62px);bottom:24px;width:min(620px,calc(100% - 48px));max-height:48%;overflow:auto;padding:14px;background:#0c0e14f2;border:1px solid var(--gold);border-radius:12px;box-shadow:0 18px 55px #000c;backdrop-filter:blur(12px)}
  .macro-dropdown.open{display:block;animation:drop-in .2s ease-out}
  @keyframes drop-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .macro-dropdown h2{color:var(--gold2);font-size:16px;margin-bottom:6px}
  .macro-dropdown p{font-size:12px;margin-bottom:8px}
  .macro-dropdown pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#07090e;border:1px solid var(--line);border-radius:8px;padding:10px;color:#e2e5eb;font:11px/1.5 ui-monospace,monospace;max-height:190px;overflow:auto}
  .macro-dropdown .copy-btn{position:static;float:right}
  .macro-close{float:right;background:none;border:0;color:var(--dim);font-size:21px;cursor:pointer}
  @media(max-width:860px){.hero-grid{grid-template-rows:1fr}.hero-main{min-height:0;padding:22px}.macro-dropdown{left:12px;bottom:12px;width:calc(100% - 24px);max-height:48%}}
</style>
</head>
<body>
<div id="app">
<main>
  <div class="grid hero-grid">

    <section class="card hero-main">
      <h1 data-ru="Умные макросы для <b>воина-неистовства</b>" data-en="Smart macros for the <b>Fury Warrior</b>">Умные макросы для <b>воина-неистовства</b></h1>
      <p data-ru="WotLK 3.3.5a · воин Неистовства · русскоязычный клиент. Макрос проверяет команды по порядку; одно нажатие не запускает всю ротацию. Открой карточку приёма и настрой его в игре на удобную кнопку."
         data-en="WotLK 3.3.5a · Fury Warrior · Russian client. Macros check commands in order; one press cannot run a full rotation. Open an ability card and bind it to any button in game.">WotLK 3.3.5a · воин Неистовства · русскоязычный клиент. Макрос проверяет команды по порядку; одно нажатие не запускает всю ротацию. Открой карточку приёма и настрой его в игре на удобную кнопку.</p>
      <div class="cta">
        <a class="btn" href="macros.html" data-ru="Открыть макросы" data-en="Open macros">Открыть макросы</a>
        <a class="btn ghost" href="hero.html" data-ru="Импортировать героя" data-en="Import your hero">Импортировать героя</a>
      </div>
      <div class="krow">
        <a href="#macro-q"><span data-ru="Ротация" data-en="Rotation">Ротация</span><img src="https://wow.zamimg.com/images/wow/icons/large/inv_axe_66.jpg" alt=""></a>
        <a href="#macro-e"><span data-ru="AoE" data-en="AoE">AoE</span><img src="https://wow.zamimg.com/images/wow/icons/large/ability_whirlwind.jpg" alt=""></a>
        <a href="#macro-r"><span data-ru="Сбить каст" data-en="Interrupt">Сбить каст</span><img src="https://wow.zamimg.com/images/wow/icons/large/inv_gauntlets_04.jpg" alt=""></a>
      </div>
      <section class="macro-dropdown" id="macroDropdown" aria-live="polite"></section>
    </section>

  </div>
</main>
</div>
<script src="assets/js/app.js"></script>
<script src="assets/js/macros-data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const lang = window.W.lang;
  document.querySelector('.cta a[href="macros.html"]').href=`macros.html?lang=${lang}`;
  document.querySelectorAll('[data-ru]').forEach(el => {
    const v = el.getAttribute('data-' + lang);
    if (v != null) el.innerHTML = v;
  });
  const titles=lang==='ru'?[
    ['Ротация одной цели','Кровожадность → Вихрь → Казнь','/startattack\n/cast [stance:1,nocombat]Рывок;[nocombat]Боевая стойка;Стойка берсерка\n/cast Победный раж\n/cast [combat]Кровавая ярость\n/cast [combat]Безрассудство\n/cast [combat]Жажда смерти\n/cast Кровожадность\n/cast Вихрь\n/cast Казнь','inv_axe_66'],
    ['Бой с группой','Вихрь и Рассекающий удар','/targetenemy [noharm][dead]\n/startattack\n/cast [combat,nostance:3]Стойка берсерка\n/cast Перехват\n/cast Вихрь\n/cast Кровожадность\n/cast Рассекающий удар\n/stopmacro [combat]\n/run s="Боевой крик"if not UnitBuff("player",s)then CastSpellByName(s)end','ability_whirlwind'],
    ['Прерывание и защита','Зуботычка и защитные умения','/cast [@mouseover,harm,nodead][]Зуботычка\n/cast [nostance:3]Стойка берсерка\n/cast Ярость берсерка\n/cast Каждый за себя\n/cast Устрашающий крик\n/cast Оборонительная стойка\n/cast Разоружение\n/cast Провокация','inv_gauntlets_04']
  ]:[
    ['Single-target rotation','Bloodthirst → Whirlwind → Execute','/startattack\n/cast [stance:1,nocombat]Charge;[nocombat]Battle Stance;Berserker Stance\n/cast Victory Rush\n/cast [combat]Bloodrage\n/cast [combat]Recklessness\n/cast [combat]Death Wish\n/cast Bloodthirst\n/cast Whirlwind\n/cast Execute','inv_axe_66'],
    ['Cleave pack','Whirlwind and Cleave','/targetenemy [noharm][dead]\n/startattack\n/cast [combat,nostance:3]Berserker Stance\n/cast Intercept\n/cast Whirlwind\n/cast Bloodthirst\n/cast Cleave\n/stopmacro [combat]\n/run s="Battle Shout"if not UnitBuff("player",s)then CastSpellByName(s)end','ability_whirlwind'],
    ['Interrupt & defense','Pummel and defensive abilities','/cast [@mouseover,harm,nodead][]Pummel\n/cast [nostance:3]Berserker Stance\n/cast Berserker Rage\n/cast Every Man for Himself\n/cast Intimidating Shout\n/cast Defensive Stance\n/cast Disarm\n/cast Taunt','inv_gauntlets_04']
  ];
  const dropdown=document.getElementById('macroDropdown');
  const openMacro=i=>{const [name,sub,body]=titles[i];dropdown.innerHTML=`<button class="macro-close" aria-label="Close">×</button><h2>${name}</h2><p>${sub}</p><button class="copy-btn" data-copy="${encodeURIComponent(body)}">✓ ${lang==='ru'?'Копировать':'Copy'}</button><pre>${body.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre><a class="tal-link" href="macros.html?lang=${lang}">${lang==='ru'?'Все макросы и подробности →':'All macros and details →'}</a>`;dropdown.classList.add('open');dropdown.querySelector('.macro-close').onclick=()=>dropdown.classList.remove('open');};
  document.querySelectorAll('.krow a').forEach((link,i)=>link.addEventListener('click',event=>{event.preventDefault();openMacro(i);}));
  document.title = lang === 'ru' ? 'WoW 3.3.5 · Fury Warrior — умные макросы' : 'WoW 3.3.5 · Fury Warrior — smart macros';
});
</script>
</body>
</html>
