    const body=(spec==='fury'&&window.MACRO_TXT?.[lang]?.[furyFiles[i]])
      ? window.MACRO_TXT[lang][furyFiles[i]].trim() : (shared || fallback);
    dropdown.innerHTML=`<button class="macro-close" aria-label="Close">×</button><h2>${name}</h2><p>${sub}</p><button class="copy-btn" data-copy="${encodeURIComponent(body)}">${lang==='ru'?'Копировать':'Copy'}</button><pre>${body.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre>`;
    dropdown.classList.add('open');
    dropdown.querySelector('.macro-close').onclick=()=>dropdown.classList.remove('open');
  };
  document.querySelectorAll('.krow a').forEach((link,i)=>link.addEventListener('click',event=>{event.preventDefault();openMacro(i);}));
});
</script>
</body>
</html>
