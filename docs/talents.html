<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
.talent-layout{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);grid-template-rows:auto 1fr;gap:14px;min-height:700px}.branch-tabs{grid-column:1/-1;display:flex;gap:10px}.branch-tab{flex:1;display:flex;align-items:center;gap:10px;padding:10px 13px;background:linear-gradient(145deg,rgba(37,39,48,.95),rgba(16,18,25,.96));border:1px solid rgba(205,174,91,.36);border-radius:12px;color:var(--txt);cursor:pointer;text-align:left}.branch-tab.active{border-color:var(--gold2);box-shadow:0 0 0 1px rgba(232,201,106,.35),0 5px 18px #0006}.branch-tab img{width:34px;height:34px;border-radius:8px}.branch-tab .branch-name{font-weight:800}.branch-tab .branch-points{margin-left:auto;color:var(--gold2);font-size:12px}.build-panel{display:flex;flex-direction:column;gap:11px;min-width:0}.point-total{display:flex;align-items:baseline;justify-content:center;gap:8px;color:var(--dim)}.point-total strong{font-size:34px;color:var(--gold2)}.share-code{display:flex;flex-direction:column;gap:6px}.share-code textarea{width:100%;height:64px;resize:none;background:#090b10;color:#c6cde0;border:1px solid var(--line);border-radius:8px;padding:8px;font:11px ui-monospace,monospace}.preset-groups{display:flex;flex-direction:column;gap:8px}.preset-group{border:1px solid rgba(201,174,98,.28);border-radius:10px;background:rgba(8,10,15,.7);overflow:hidden}.preset-group[open]{border-color:rgba(232,201,106,.56);box-shadow:0 7px 20px #0005}.preset-group summary{display:flex;align-items:center;gap:9px;padding:9px;background:rgba(255,255,255,.025);cursor:pointer;list-style:none}.preset-group summary::-webkit-details-marker{display:none}.preset-group summary img{width:31px;height:31px;border-radius:7px}.branch-meta{display:flex;flex-direction:column;gap:2px;min-width:0}.branch-meta small{font-size:11px;color:var(--dim);line-height:1.35}.count-pill{margin-left:auto;padding:3px 7px;border:1px solid #796536;border-radius:99px;color:#f0d985;background:#b38d2b18;font-size:10px;white-space:nowrap}.preset-items{display:flex;flex-direction:column;gap:6px;padding:7px}.preset-items button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);cursor:pointer;font-size:12px;font-weight:650}.preset-items button:hover{border-color:var(--gold)}.preset-items small{display:block;color:var(--dim);font-size:10.5px;font-weight:400;margin-top:3px}.preset-level{flex:none;color:#f0d985;border:1px solid #6b5a36;border-radius:99px;padding:3px 7px;font-size:10px}.talent-tree{position:relative;overflow:auto;min-height:530px;border-radius:14px;border:1px solid rgba(226,190,92,.52);background:center/cover no-repeat;box-shadow:inset 0 0 50px #0008,0 10px 28px #0006}.tree-banner{position:sticky;top:0;z-index:4;text-align:center;padding:8px;background:#090b10d9;color:#f3d77c;border-bottom:1px solid #d2af55aa;letter-spacing:.12em;text-transform:uppercase;font-size:11px;backdrop-filter:blur(5px)}.tree-inner{position:relative;width:420px;min-height:100%;margin:auto;padding:19px 12px;background:rgba(8,10,15,.73)}.talent-row{display:grid;grid-template-columns:repeat(4,76px);justify-content:center;gap:17px;margin:9px 0 18px;position:relative;z-index:2}.talent{position:relative;width:76px;border:0;background:none;color:var(--txt);cursor:pointer}.talent-frame{display:block;width:64px;height:64px;margin:auto;background:#05070b;border:1px solid #4a5367;border-radius:9px;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}.talent:hover .talent-frame{transform:translateY(-2px);box-shadow:0 0 17px #edcf5c44}.talent-frame img{width:100%;height:100%;opacity:.42;filter:grayscale(.8)}.talent.learned .talent-frame img{opacity:1;filter:none}.talent.learned .talent-frame{border-color:#5db56a}.talent.maxed .talent-frame{border-color:#e7c65f;box-shadow:0 0 13px #e7c65f55}.talent-rank{position:absolute;right:0;bottom:0;padding:2px 5px;background:#08090e;border:1px solid #394052;border-radius:6px;font-size:10px;font-weight:800}.talent.maxed .talent-rank{color:#f3d77c}.talent-tip{position:fixed;z-index:100;right:18px;bottom:18px;width:min(360px,calc(100vw - 36px));padding:14px;background:#0b0d14f5;border:1px solid var(--gold);border-radius:12px;box-shadow:0 12px 36px #000a;line-height:1.5}.talent-tip[hidden]{display:none}.talent-tip img{width:42px;height:42px;float:left;margin:0 10px 6px 0;border-radius:8px}.talent-tip b{display:block;color:var(--gold2)}.talent-tip small{color:var(--dim)}.talent-tip p{clear:both;padding-top:7px}.preset-note{font-size:11px;color:var(--dim);line-height:1.4;padding:0 3px}
@media(max-width:930px){.talent-layout{grid-template-columns:1fr;grid-template-rows:auto auto minmax(500px,1fr)}.branch-tabs{grid-column:auto}.build-panel{max-height:none}.talent-tree{min-height:540px}}
@media(max-width:560px){.branch-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.branch-tab{flex-direction:column;text-align:center;padding:8px 4px;gap:4px;font-size:11px}.branch-tab img{width:25px;height:25px}.branch-tab .branch-points{margin:0}.tree-inner{width:320px;padding-inline:5px}.talent-row{grid-template-columns:repeat(4,66px);gap:7px}.talent{width:66px}.talent-frame{width:55px;height:55px}.talent-tip{left:10px;right:10px;bottom:10px;width:auto}}
</style>

<body>
<div id="app"><main><div class="talent-layout"><div class="branch-tabs" id="tabs"></div><section class="card build-panel" id="build-panel"></section><section class="talent-tree" id="talent-tree"><div class="tree-banner" id="tree-banner"></div><div class="tree-inner" id="tree-inner"></div></section></div></main></div><aside id="talent-tip" class="talent-tip" hidden></aside>

];
function launchTalentUI(){
const lang=window.W.lang, TALENTS=window.TALENTS, I=window.W.icon, order=['arms','fury','prot'], names={arms:['Оружие','Arms'],fury:['Неистовство','Fury'],prot:['Защита','Protection']}, icons={arms:'ability_rogue_eviscerate',fury:'ability_racial_avatar',prot:'ability_warrior_defensivestance'}, byId={};TALENTS.trees.forEach(t=>t.talents.forEach(x=>byId[x.id]={...x,tree:t.key}));
const state={tree:'fury',pts:{},hover:null};
const pointTotal=p=>Object.values(p).reduce((a,v)=>a+v,0), treePoints=key=>TALENTS.trees.find(t=>t.key===key).talents.reduce((a,t)=>a+(state.pts[t.id]||0),0), total=()=>pointTotal(state.pts);
function decodeBuild(code){const parts=code.split('-');if(parts.length!==3||parts.some(x=>!/^[0-5]{44}$/.test(x)))return null;const p={};TALENTS.trees.forEach((tree,ti)=>{let k=0;for(let r=0;r<11;r++)for(let c=0;c<4;c++){const t=tree.talents.find(x=>x.row===r&&x.col===c),rank=+parts[ti][k++];if(t&&rank){if(rank>t.ranks)return;p[t.id]=rank}}});const total=pointTotal(p);if(total>71)return null;for(const [id,rank]of Object.entries(p)){const t=byId[id];if(!t||t.row*5>TALENTS.trees.find(x=>x.key===t.tree).talents.reduce((s,x)=>s+(p[x.id]||0),0))return null;for(const req of t.requires||[])if((p[req.id]||0)<req.qty)return null}return p}
const queryBuild=new URLSearchParams(location.search).get('build');if(queryBuild){const loaded=decodeBuild(queryBuild);if(loaded)state.pts=loaded}
function canAdd(t){if((state.pts[t.id]||0)>=t.ranks)return false;if(total()>=71)return false;if(treePoints(t.tree)<t.row*5)return false;return(t.requires||[]).every(r=>(state.pts[r.id]||0)>=r.qty)}
function makeLink(points){const u=new URL(location.href);u.searchParams.set('build',codeFor(points));u.searchParams.set('lang',lang);return u.toString()}
function codeFor(points){return TALENTS.trees.map(tree=>{let s='';for(let r=0;r<11;r++)for(let c=0;c<4;c++){const t=tree.talents.find(x=>x.row===r&&x.col===c);s+=t?(points[t.id]||0):0}return s}).join('-')}
function render(){const tabs=document.getElementById('tabs');tabs.innerHTML=order.map(k=>`<button type="button" class="branch-tab ${state.tree===k?'active':''}" data-tree="${k}"><img src="${I(icons[k])}" alt=""><span>${names[k][lang==='ru'?0:1]}</span><b class="branch-points">${treePoints(k)}</b></button>`).join('');tabs.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>{state.tree=b.dataset.tree;render()});const tree=TALENTS.trees.find(t=>t.key===state.tree);const target=document.getElementById('tree-inner');target.innerHTML=`<div class="tree-stage-label">${names[state.tree][lang==='ru'?0:1]} · ${lang==='ru'?'Древо талантов':'Talent tree'}</div>`;document.getElementById('talent-tree').style.backgroundImage=`linear-gradient(#090b12a8,#090b12c7),url(assets/icons/bg/${tree.bg}.jpg)`;for(let r=0;r<11;r++){const row=document.createElement('div');row.className='talent-row';for(let c=0;c<4;c++){const t=tree.talents.find(x=>x.row===r&&x.col===c);if(!t){const blank=document.createElement('div');blank.className='talent empty';row.append(blank);continue}const rank=state.pts[t.id]||0,button=document.createElement('button');button.type='button';button.className='talent '+(rank?'learned ':'')+(rank===t.ranks?'maxed':'');button.dataset.id=t.id;button.setAttribute('aria-label',`${lang==='ru'?t.ru.name:t.en.name} ${rank}/${t.ranks}`);button.innerHTML=`<span class="talent-frame"><img src="${I(t.icon)}" alt=""></span><span class="talent-rank">${rank}/${t.ranks}</span>`;button.onclick=()=>{if(canAdd(t)){state.pts[t.id]=rank+1;render()}else showTip(t)};button.oncontextmenu=e=>{e.preventDefault();if(rank>0){state.pts[t.id]=rank-1;render()}else showTip(t)};button.onmouseenter=()=>showTip(t);row.append(button)}target.append(row)}renderPanel()}
function renderPanel(){const panel=document.getElementById('build-panel'),groups=order.map(tree=>({tree,presets:PRESETS.map((p,i)=>({p,i})).filter(x=>x.p.tree===tree)})),source={guide:lang==='ru'?'прокачка':'leveling',raid:lang==='ru'?'PvE рейд':'PvE raid',solo:lang==='ru'?'соло':'solo'};panel.innerHTML=`<div class="point-total"><strong>${total()}</strong><span>${lang==='ru'?'из 71 очка талантов':'of 71 talent points'}</span></div><div class="build-link"><textarea id="build-code" readonly>${codeFor(state.pts)}</textarea><button type="button" class="btn ghost" id="share-build">${lang==='ru'?'Скопировать ссылку':'Copy share link'}</button></div><div class="build-status"><strong>${lang==='ru'?'Выбранная ветка:':'Selected tree:'}</strong> ${names[state.tree][lang==='ru'?0:1]} · ${treePoints(state.tree)} ${lang==='ru'?'очков':'points'}</div><div class="preset"><h2>${lang==='ru'?'Пути прокачки и билды 80-го':'Leveling paths and level-80 builds'}</h2>${groups.map(g=>`<details class="preset-group" ${g.tree===state.tree?'open':''}><summary><img src="${I(icons[g.tree])}" alt=""><span class="branch-copy"><b>${names[g.tree][lang==='ru'?0:1]}</b><span class="branch-note">${g.tree==='fury'?(lang==='ru'?'Прокачка · рейдовый и соло 80':'Leveling · raid and solo 80'):(g.tree==='arms'?(lang==='ru'?'Двуручное оружие · PvE':'Two-handed · PvE'):(lang==='ru'?'Танк прокачки и данжей':'Leveling and dungeon tank'))}</span></span><span class="branch-count">${g.presets.length}</span></summary><div class="preset-list">${g.presets.map(({p,i})=>`<button type="button" data-preset="${i}"><span>${lang==='ru'?p.ru:p.en}<small>${lang==='ru'?'Уровень':'Level'} ${p.level} · ${pointTotal(p.points)} ${lang==='ru'?'очков':'points'} · ${source[p.source]}</small></span><span class="preset-level">L${p.level}</span></button>`).join('')}</div></details>`).join('')}</div><div class="button-row"><button type="button" class="btn ghost" id="reset-build">${lang==='ru'?'Сбросить':'Reset'}</button><a class="btn ghost" href="hero.html?lang=${lang}" data-ru="Герой / демо" data-en="Hero / demo">${lang==='ru'?'Герой / демо':'Hero / demo'}</a></div><p class="small muted">${lang==='ru'?'ЛКМ — добавить ранг · ПКМ — убрать · нажми «Скопировать ссылку», чтобы поделиться':'Click to add · right-click to remove · copy a shareable build link'}</p>`;panel.querySelector('#reset-build').onclick=()=>{state.pts={};render()};panel.querySelector('#share-build').onclick=async e=>{const link=makeLink(state.pts);let ok=false;try{await navigator.clipboard.writeText(link);ok=true}catch{}if(!ok){const t=panel.querySelector('#build-code');t.value=link;t.select();try{ok=document.execCommand('copy')}catch{}t.value=codeFor(state.pts)}e.currentTarget.textContent=ok?(lang==='ru'?'Ссылка скопирована':'Link copied'):(lang==='ru'?'Не удалось скопировать':'Copy failed');setTimeout(()=>{if(panel.querySelector('#share-build'))panel.querySelector('#share-build').textContent=lang==='ru'?'Скопировать ссылку':'Copy share link'},1300)};panel.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.preset];state.tree=p.tree;state.pts={...p.points};render()})}
function showTip(t){const tip=document.getElementById('talent-tip');tip.hidden=false;tip.innerHTML=`<img src="${I(t.icon)}" alt=""><b>${lang==='ru'?t.ru.name:t.en.name}</b><small>${state.pts[t.id]||0}/${t.ranks}</small><p>${lang==='ru'?t.ru.desc:t.en.desc}</p>`}
document.title=(lang==='ru'?'Таланты':'Talents')+' — WoW 3.3.5a';render();
}
</script></body></html>
