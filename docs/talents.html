const state={tree:'fury',pts:{},tipTalent:null},TREES=TALENTS.trees,byId={};TREES.forEach(t=>t.talents.forEach(x=>byId[x.id]={...x,tree:t.key}));const savedBuild=new URLSearchParams(location.search).get('build');if(savedBuild){const parts=savedBuild.split('-');if(parts.length===3&&parts.every(x=>/^\d{44}$/.test(x)))TREES.forEach((tree,ti)=>{let i=0;for(let r=0;r<11;r++)for(let c=0;c<4;c++){const t=tree.talents.find(x=>x.row===r&&x.col===c),rank=+parts[ti][i++];if(t&&rank>0)state.pts[t.id]=Math.min(rank,t.ranks)}})}
function treePoints(key){return TREES.find(t=>t.key===key).talents.reduce((s,x)=>s+(state.pts[x.id]||0),0)}function totalPoints(){return Object.values(state.pts).reduce((a,b)=>a+b,0)}function canLearn(x){if((state.pts[x.id]||0)>=x.ranks||treePoints(x.tree)<x.row*5)return false;return(x.requires||[]).every(req=>(state.pts[req.id]||0)>=req.qty)}function buildCode(p=state.pts){return TREES.map(t=>{let s='';for(let r=0;r<11;r++)for(let c=0;c<4;c++){const x=t.talents.find(v=>v.row===r&&v.col===c);s+=x?(p[x.id]||0):0}return s}).join('-')}
