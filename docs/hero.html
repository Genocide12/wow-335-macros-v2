<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Герой — WoW 3.3.5 Fury</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .h-layout { grid-template-columns: 1fr 340px; grid-template-rows: 1fr; }
  #doll { overflow-y: auto; }
  .char-head { text-align: center; margin-bottom: 8px; }
  .char-head .nm { font-size: 21px; font-weight: 800; color: #fff; }
  .char-head .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .doll-grid { display: grid; grid-template-columns: 46px 1fr 46px; gap: 8px; justify-items: center; align-items: start; }
  .doll-col { display: flex; flex-direction: column; gap: 6px; }
  .slot { width: 44px; height: 44px; border-radius: 4px; background: #05070c;
    border: 1px solid #4a4436; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; box-shadow: inset 0 0 6px rgba(0,0,0,.6); }
  .slot img { width: 38px; height: 38px; border-radius: 3px; }
  .slot.empty img { opacity: .45; filter: grayscale(.45); }
  .slot.has:hover img { transform: scale(1.06); }
  .slot:hover { border-color: #8a7f5c; }
  .doll-center { text-align: center; padding: 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .portrait { width: 74px; height: 74px; border-radius: 50%; border: 2px solid #7a6d4b;
    background: radial-gradient(circle at 50% 35%, #2a3049, #05070c); object-fit: cover; padding: 4px; }
  .cstats { width: 100%; display: flex; flex-direction: column; gap: 3px; }
  .crow { display: flex; justify-content: space-between; gap: 12px; font-size: 12px;
    background: rgba(10,12,18,.55); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; }
  .crow .l { color: var(--dim); }
  .crow .v { color: var(--gold2); font-weight: 700; }
  .talents { display: flex; gap: 4px; width: 100%; }
  .tal { flex: 1; background: rgba(10,12,18,.55); border: 1px solid var(--line); border-radius: 7px; padding: 4px 2px; }
  .tal .v { font-weight: 800; color: #fff; font-size: 13px; }
  .tal .l { font-size: 9.5px; color: var(--dim); }
  .weapons { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .legacy-warn { display: none; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #ffd35c;
    background: rgba(64,48,10,.35); border: 1px solid #6d5a1f; border-radius: 9px; padding: 8px 10px; }
  .tipcard { position: fixed; z-index: 100; display: none; width: 288px; background: rgba(3,5,10,.96);
    border: 2px solid #4a4436; border-radius: 6px; padding: 9px 11px; font-size: 12px; line-height: 1.5;
    text-align: left; box-shadow: 0 10px 40px rgba(0,0,0,.7); }
  .tipcard b.nm { font-size: 13px; }
  .tipcard .tl { color: #9aa3b5; }
  .tipcard .body { margin-top: 6px; border-top: 1px solid #2a3049; padding-top: 5px; }
  .tipcard .body b { font-weight: 700; }
  .q0 { color: #9d9d9d; } .q1 { color: #fff; } .q2 { color: #1eff00; } .q3 { color: #0070dd; }
  .q4 { color: #a335ee; } .q5 { color: #ff8000; } .q6 { color: #e6cc80; }
  .import { display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .import textarea { flex: 0 0 auto; height: 108px; background: #0a0c12; color: #9fb0d0; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font-family: ui-monospace, monospace; font-size: 11px; resize: none; }
  .steps { display: flex; flex-direction: column; gap: 7px; }
  .step { display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; }
  .step .n { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--gold);
    color: var(--gold2); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  #m1 pre, #m2 pre { white-space: pre-wrap; word-break: break-all; padding-right: 66px; }
  .demo-btn { align-self: flex-start; }
  @media (max-width: 980px) {
    .h-layout { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .import textarea { height: 90px; }
  }
</style>
</head>
<body>
<div id="app">
<main>
  <div class="grid h-layout">
    <section class="card" id="doll">
      <div class="char-head">
        <div class="nm" id="cname" data-ru="Твой герой" data-en="Your hero">Твой герой</div>
        <div class="sub" id="csub" data-ru="Импортируй данные справа →" data-en="Import data on the right →">Импортируй данные справа →</div>
      </div>
      <div class="doll-grid" id="doll-grid"></div>
      <div class="weapons" id="weapons"></div>
      <div class="legacy-warn" id="legacywarn"></div>
    </section>

    <section class="card import">
      <h2><img class="ic" src="https://wow.zamimg.com/images/wow/icons/large/ability_warrior_battleshout.jpg" alt="">
        <span data-ru="Импорт из игры" data-en="Import from game">Импорт из игры</span>
        <span id="hintSlot"></span></h2>
      <div class="steps">
        <div class="step"><span class="n">1</span><div data-ru="В игре набери /macro, создай два новых макроса и вставь в них строки ниже. Нажимай кнопку МАКРОСА на панели — не отправляй строку в чат!" data-en="In game type /macro, create two new macros and paste the lines below into them. Press the MACRO BUTTON on your action bar — do not send the line to chat!">В игре набери /macro, создай два новых макроса и вставь в них строки ниже. Нажимай кнопку МАКРОСА на панели — не отправляй строку в чат!</div></div>
        <div class="step"><span class="n">2</span><div data-ru="Открой чат, выдели строки WEXP|… и скопируй (Ctrl+C)." data-en="Open chat, select the WEXP|… lines and copy (Ctrl+C).">Открой чат, выдели строки WEXP|… и скопируй (Ctrl+C).</div></div>
        <div class="step"><span class="n">3</span><div data-ru="Вставь их сюда и нажми «Показать»." data-en="Paste them here and press Show.">Вставь их сюда и нажми «Показать».</div></div>
      </div>
      <div class="macro-box" id="m1"></div>
      <div class="macro-box" id="m2"></div>
      <textarea id="paste" placeholder="WEXP1|…&#10;WEXP0|…&#10;WEXP2|…"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" id="show" data-ru="Показать" data-en="Show">Показать</button>
        <button class="btn ghost demo-btn" id="demo" data-ru="Демо-герой" data-en="Demo hero">Демо-герой</button>
        <button class="btn ghost demo-btn" id="clear" data-ru="Очистить" data-en="Clear">Очистить</button>
      </div>
    </section>
  </div>
</main>
</div>
<div class="tipcard" id="itemtip"></div>
<script src="assets/js/app.js"></script>
<script src="assets/js/macros-data.js"></script>
<script src="assets/js/talents-data.js"></script>
<script>
(() => {
  const lang = window.W.lang;
  const L = {
    ru: { copy: 'копировать',
      hint: 'Аддон не нужен: экспорт делают два коротких /run-макроса. Важно: в игре нажимай кнопку МАКРОСА, а не отправляй строку в чат — из чата она не работает. Годится любой клиент 3.3.5a.',
      err: 'Не нашёл строк WEXP|… — проверь, что скопировал их из чата целиком.',
      warn: '<b>Старый формат экспорта</b> — иконок и цветов нет. Пересоздай в игре макрос «Экспорт 2» по новой версии ниже (она выводит для каждой вещи цвет, уровень, иконку и ID) и вставь строки заново.',
      ilvlAvg: 'Ср. ур. предметов', ap: 'Сила атаки', hp: 'Здоровье',
      t0: 'Оружие', t1: 'Неистовство', t2: 'Защита',
      ilvlLine: 'Уровень предмета', lvl: 'Уровень', clsRu: { WARRIOR: 'Воин', PALADIN: 'Паладин', HUNTER: 'Охотник', ROGUE: 'Разбойник', PRIEST: 'Жрец', SHAMAN: 'Шаман', MAGE: 'Маг', WARLOCK: 'Колдун', DRUID: 'Друид', DEATHKNIGHT: 'Рыцарь смерти' },
      raceEn: {} },
    en: { copy: 'copy',
      hint: 'No addon needed: the export is done by two short /run macros. Important: in game press the MACRO BUTTON, do not paste the line into chat — it does nothing from chat. Works on any 3.3.5a client.',
      err: 'No WEXP|… lines found — make sure you copied them fully from chat.',
      warn: '<b>Legacy export format</b> — no icons or colors. Recreate the “Export 2” macro in game from the new version below (it prints color, level, icon and ID for every item) and paste the lines again.',
      ilvlAvg: 'Avg. item level', ap: 'Attack Power', hp: 'Health',
      t0: 'Arms', t1: 'Fury', t2: 'Protection',
      ilvlLine: 'Item level', lvl: 'Level',
      clsRu: {}, raceEn: { 'Человек': 'Human', 'Дворф': 'Dwarf', 'Ночной эльф': 'Night Elf', 'Гном': 'Gnome', 'Дреней': 'Draenei', 'Орк': 'Orc', 'Нежить': 'Undead', 'Таурен': 'Tauren', 'Тролль': 'Troll', 'Эльф крови': 'Blood Elf' } }
  };
  L.en.slots = () => ({ 1: 'Head', 2: 'Neck', 3: 'Shoulder', 15: 'Back', 5: 'Chest', 4: 'Shirt', 19: 'Tabard', 9: 'Wrist', 10: 'Hands', 6: 'Waist', 7: 'Legs', 8: 'Feet', 11: 'Finger', 12: 'Finger', 13: 'Trinket', 14: 'Trinket', 16: 'Main hand', 17: 'Off hand', 18: 'Ranged' });
  L.ru.slots = () => ({ 1: 'Голова', 2: 'Шея', 3: 'Плечи', 15: 'Спина', 5: 'Грудь', 4: 'Рубашка', 19: 'Гербовая накидка', 9: 'Запястья', 10: 'Кисти рук', 6: 'Пояс', 7: 'Ноги', 8: 'Ступни', 11: 'Кольцо', 12: 'Кольцо', 13: 'Аксессуар', 14: 'Аксессуар', 16: 'Правая рука', 17: 'Левая рука', 18: 'Дальний бой' });

  // in-game character pane layout (WotLK)
  const LEFT  = [1, 2, 3, 15, 5, 4, 19, 9];
  const RIGHT = [10, 6, 7, 8, 11, 12, 13, 14];
  const WEAPONS = [16, 17, 18];
  const SLOT_ICONS = {
    1: 'inv_helmet_04', 2: 'inv_jewelry_necklace_11', 3: 'inv_shoulder_09', 4: 'inv_shirt_05',
    5: 'inv_chest_plate04', 6: 'inv_belt_05', 7: 'inv_pants_04', 8: 'inv_boots_05',
    9: 'inv_bracer_07', 10: 'inv_gauntlets_04', 11: 'inv_jewelry_ring_03', 12: 'inv_jewelry_ring_04',
    13: 'inv_jewelry_talisman_04', 14: 'inv_jewelry_talisman_01', 15: 'inv_misc_cape_18',
    16: 'inv_sword_10', 17: 'inv_shield_04', 18: 'inv_weapon_crossbow_01', 19: 'inv_shirt_guildtabard_01'
  };
  const QCOL = { 0: '#9d9d9d', 1: '#fff', 2: '#1eff00', 3: '#0070dd', 4: '#a335ee', 5: '#ff8000', 6: '#e6cc80' };

  const $ = id => document.getElementById(id);
  const state = { char: null, gear: {}, tips: {}, legacy: false };

  function macroRun(file) {
    return ((((window.MACRO_TXT || {})[lang] || {})[file] || '')
      .split('\n').filter(l => l.startsWith('/run')).join('\n'));
  }
  function texIcon(tex) {
    const name = (tex || '').split(/[\\/]+/).pop().toLowerCase();
    return name ? window.W.icon(name) : '';
  }
  function itemIcon(g, slot) {
    if (g && g.tex) return texIcon(g.tex);
    if (g && g.id && state.tips[g.id] && state.tips[g.id].icon) return window.W.icon(state.tips[g.id].icon);
    return window.W.icon(SLOT_ICONS[slot] || 'inv_misc_questionmark');
  }

  function init() {
    document.querySelectorAll('[data-ru]').forEach(el => { el.textContent = el.getAttribute('data-' + lang) || el.textContent; });
    document.title = (lang === 'ru' ? 'Герой' : 'Hero') + ' — WoW 3.3.5 Fury';
    $('hintSlot').innerHTML = window.W.hint(L[lang].hint, true);
    const m1 = macroRun('export-part1'), m2 = macroRun('export-part2');
    $('m1').innerHTML = `<button class="copy-btn" data-copy="${encodeURIComponent(m1)}">✓ ${L[lang].copy}</button><pre style="font-size:10px;max-height:86px">${esc(m1)}</pre>`;
    $('m2').innerHTML = `<button class="copy-btn" data-copy="${encodeURIComponent(m2)}">✓ ${L[lang].copy}</button><pre style="font-size:10px;max-height:86px">${esc(m2)}</pre>`;
    drawDoll();
    $('show').onclick = parse;
    $('clear').onclick = () => { state.char = null; state.gear = {}; state.legacy = false; drawDoll(); $('paste').value = ''; };
    $('demo').onclick = () => { $('paste').value = DEMO.join('\n'); parse(); };
  }
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function parse() {
    const lines = $('paste').value.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const char = { name: '?', cls: 'WARRIOR', lvl: 0, race: '', ap: 0, hp: 0, tal: [0, 0, 0] };
    const gear = {};
    let found = false, legacy = false;
    for (const ln of lines) {
      const m = ln.match(/^WEXP([012])\|(.*)$/);
      if (!m) continue;
      found = true;
      const p = m[2].split('|');
      if (m[1] === '1') {
        char.name = p[0]; char.cls = p[1] || 'WARRIOR'; char.lvl = +p[2] || 0;
        char.ap = +p[3] || 0; char.hp = +p[4] || 0;
        if (p[5]) char.tal = p[5].split('/').map(Number);
      } else if (m[1] === '0') {
        char.race = p[0] || '';
      } else {
        const slot = +p[0];
        if (p.length >= 6 && /^\d+$/.test(p[1] || '') && /^\d+$/.test(p[2] || '') && /^\d+$/.test(p[3] || '') && /icons/i.test(p[4] || '')) {
          // WEXP2|slot|rarity|ilvl|itemid|texture|name
          gear[slot] = { q: +p[1], ilvl: +p[2], id: +p[3], tex: p[4], name: p.slice(5).join('|') };
        } else {
          legacy = true;
          const link = p.slice(1).join('|');
          const im = link.match(/item:(\d+)/), nm = link.match(/\[([^\]]*)\]/);
          gear[slot] = { id: im ? +im[1] : 0, name: nm ? nm[1] : link.replace(/[\[\]]/g, '') };
        }
      }
    }
    if (!found) { alert(L[lang].err); return; }
    state.char = char; state.gear = gear; state.legacy = legacy;
    drawDoll();
    loadItemTips();
  }

  function drawDoll() {
    const T = L[lang];
    const c = state.char;
    const grid = $('doll-grid');
    const mk = slot => {
      const g = state.gear[slot];
      const d = document.createElement('div');
      d.className = 'slot' + (g ? ' has' : ' empty');
      d.dataset.slot = slot;
      d.innerHTML = `<img src="${itemIcon(g, slot)}" alt="">`;
      if (g && g.q != null) d.style.borderColor = QCOL[g.q] || '#4a4436';
      d.onmouseenter = () => showTip(d, slot);
      d.onmouseleave = hideTip;
      return d;
    };
    const col = arr => { const w = document.createElement('div'); w.className = 'doll-col'; arr.forEach(s => w.appendChild(mk(s))); return w; };
    // center panel
    const center = document.createElement('div');
    center.className = 'doll-center';
    const clsRu = T.clsRu[c && c.cls] || (c && c.cls) || '...';
    const race = c && c.race ? (lang === 'en' ? (T.raceEn[c.race] || c.race) : c.race) : '';
    const ilvls = Object.values(state.gear).map(g => g && g.ilvl).filter(v => v > 0);
    const avgIlvl = ilvls.length ? Math.round(ilvls.reduce((a, b) => a + b, 0) / ilvls.length) : null;
    center.innerHTML = `
      <img class="portrait" src="${window.W.icon('classicon_warrior')}" alt="">
      <div class="cstats">
        ${c ? `<div class="crow"><span class="l">${T.ap}</span><span class="v">${c.ap}</span></div>
        <div class="crow"><span class="l">${T.hp}</span><span class="v">${c.hp}</span></div>
        ${avgIlvl ? `<div class="crow"><span class="l">${T.ilvlAvg}</span><span class="v">${avgIlvl}</span></div>` : ''}` : ''}
      </div>
      ${c ? `<div class="talents">
        <div class="tal"><div class="v">${c.tal[0] || 0}</div><div class="l">${T.t0}</div></div>
        <div class="tal"><div class="v">${c.tal[1] || 0}</div><div class="l">${T.t1}</div></div>
        <div class="tal"><div class="v">${c.tal[2] || 0}</div><div class="l">${T.t2}</div></div>
      </div>` : ''}`;
    grid.innerHTML = '';
    grid.appendChild(col(LEFT));
    grid.appendChild(center);
    grid.appendChild(col(RIGHT));
    const wp = $('weapons');
    wp.innerHTML = '';
    WEAPONS.forEach(s => wp.appendChild(mk(s)));
    // header
    if (c) {
      $('cname').textContent = c.name;
      $('csub').textContent = `${T.lvl} ${c.lvl} ${race ? race + ', ' : ''}${clsRu}`;
    }
    const warn = $('legacywarn');
    warn.style.display = state.legacy ? 'block' : 'none';
    warn.innerHTML = T.warn;
  }

  async function loadItemTips() {
    const jobs = Object.entries(state.gear).filter(([s, g]) => g && g.id && !state.tips[g.id]);
    for (const [slot, g] of jobs) {
      fetch(`https://nether.wowhead.com/wotlk/tooltip/item/${g.id}?locale=${lang}`)
        .then(r => r.ok ? r.json() : null)
        .then(j => {
          if (!j) return;
          state.tips[g.id] = j;
          const d = document.querySelector(`.slot[data-slot="${slot}"]`);
          if (!d) return;
          if (!g.tex && j.icon) d.querySelector('img').src = window.W.icon(j.icon);
          if (g.q == null && j.quality != null) d.style.borderColor = QCOL[j.quality] || '#4a4436';
        }).catch(() => {});
    }
  }

  function cleanTip(html) {
    return html
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<th[\s\S]*?<\/th>/g, '')
      .replace(/<\/?table[^>]*>/g, '<br>')
      .replace(/<\/?tbody>/g, '')
      .replace(/<tr[^>]*>/g, '')
      .replace(/<td[^>]*>/g, '').replace(/<\/td>/g, '<br>')
      .replace(/<\/tr>/g, '')
      .replace(/<a[^>]*>/g, '').replace(/<\/a>/g, '')
      .replace(/<div[^>]*>/g, '').replace(/<\/div>/g, '<br>')
      .replace(/<\/?span[^>]*>/g, '')
      .replace(/<br\s*\/?>/gi, '<br>')
      .replace(/(<br>\s*)+/g, '<br>')
      .replace(/^(<br>|\s)+/, '')
      .replace(/^<b[^>]*>[^<]*<\/b>/, '')
      .replace(/<br>\s*(Уровень предмета|Item Level)\s*:?\s*\d+/gi, '')
      .replace(/\)(?=[А-ЯЁA-Z])/g, ')<br>')
      .replace(/^(<br>|\s)+/, '').replace(/(<br>|\s)+$/, '')
      .trim();
  }

  function showTip(el, slot) {
    const T = L[lang], slots = T.slots();
    const g = state.gear[slot];
    const tip = $('itemtip');
    if (!g) {
      tip.innerHTML = `<b class="nm" style="color:#fff">${slots[slot]}</b>`;
    } else {
      const t = g.id ? state.tips[g.id] : null;
      const q = g.q != null ? g.q : (t ? t.quality : 1);
      const nm = (t && t.name) || g.name || '#' + (g.id || '');
      let html = `<b class="nm q${q}">${esc(nm)}</b><br>`;
      if (g.ilvl) html += `<span class="tl">${T.ilvlLine} ${g.ilvl}</span><br>`;
      html += `<span class="tl">${slots[slot]}</span>`;
      if (t && t.tooltip) html += `<div class="body">${cleanTip(t.tooltip)}</div>`;
      else if (g.id) html += `<div class="body"><span class="tl">…</span></div>`;
      tip.innerHTML = html;
    }
    tip.style.display = 'block';
    const r = el.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.right + 10, y = r.top;
    if (x + tw > innerWidth - 8) x = Math.max(8, r.left - tw - 10);
    if (y + th > innerHeight - 8) y = Math.max(8, innerHeight - th - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { $('itemtip').style.display = 'none'; }

  const DEMO = [
    'WEXP1|Таррен|WARRIOR|58|812|3890|0/49/0',
    'WEXP0|Человек',
    'WEXP2|1|3|62|16731|Interface\\Icons\\inv_helmet_02|Шлем доблести',
    'WEXP2|3|3|60|16733|Interface\\Icons\\inv_shoulder_30|Наплеч доблести',
    'WEXP2|5|3|63|16730|Interface\\Icons\\inv_chest_plate03|Кираса доблести',
    'WEXP2|6|3|58|16736|Interface\\Icons\\inv_belt_34|Пояс доблести',
    'WEXP2|7|3|61|16732|Interface\\Icons\\inv_pants_04|Ножные латы доблести',
    'WEXP2|8|3|59|16734|Interface\\Icons\\inv_boots_plate_03|Сапоги доблести',
    'WEXP2|9|3|57|16735|Interface\\Icons\\inv_bracer_18|Наручи доблести',
    'WEXP2|10|3|59|16737|Interface\\Icons\\inv_gauntlets_26|Рукавицы доблести',
