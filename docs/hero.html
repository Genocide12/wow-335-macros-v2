<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Герой — WoW 3.3.5 Fury</title>
<link rel="stylesheet" href="assets/css/app.css?v=20261114d">
<style>
  .h-layout { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr); }
  #doll{border:1px solid #77633a;background:linear-gradient(145deg,#20222a,#10131b);box-shadow:inset 0 0 0 2px #ffffff08,0 10px 35px #0008}
  #doll { overflow: hidden; }
  .char-head { display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;text-align:center;margin-bottom:8px; }
  .char-head .nm { font-size: 21px; font-weight: 800; color: #fff; }
  .char-head .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .hero-util{width:38px;height:38px;display:grid;place-items:center;border:1px solid #75633d;border-radius:10px;background:linear-gradient(145deg,#27251f,#11141c);color:#e8c96a;cursor:pointer}
  #levelNext{border-color:#9e3e39;background:linear-gradient(145deg,#8e2c27,#431a1c);color:#ff6158}
  #levelNext:hover{box-shadow:0 0 16px #e6473d77;filter:brightness(1.18)}
  .hero-util svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .doll-grid { display: grid; grid-template-columns: 42px minmax(0,1fr) 42px; gap: 2px; justify-items: center; align-items: start; }
  .doll-col { display: flex; flex-direction: column; gap: 3px; }
  .slot { width: 36px; height: 36px; border-radius: 4px; background: #05070c;
    border: 1px solid #4a4436; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; box-shadow: inset 0 0 6px rgba(0,0,0,.6); }
  .slot img { width: 30px; height: 30px; border-radius: 3px; }
  .slot.empty img { opacity: .45; filter: grayscale(.45); }
  .slot.has:hover img { transform: scale(1.06); }
  .slot:hover { border-color: #8a7f5c; }
  .doll-center { text-align: center; padding: 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; width:100%; }
  .character-stage{position:relative;width:100%;height:clamp(270px,46vh,390px);max-height:none;min-height:270px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none;touch-action:none}
  #wow-model{position:absolute;inset:0;z-index:2;width:100%;height:100%;opacity:1;transition:opacity .5s;cursor:grab;touch-action:none}
  #wow-model:active{cursor:grabbing}
  #wow-model canvas{width:100%!important;height:100%!important;display:block}
  .character-stage.model-ready #wow-model{opacity:1}
  .model-status{position:absolute;z-index:3;left:8px;right:8px;bottom:6px;color:#c6b681;font-size:10px;text-align:center;text-shadow:0 2px 4px #000;pointer-events:none}
  .model-status:empty{display:none}
  .portrait { width: 74px; height: 74px; border-radius: 50%; border: 2px solid #7a6d4b;
    background: radial-gradient(circle at 50% 35%, #2a3049, #05070c); object-fit: cover; padding: 4px; }
  .cstats { width: 100%; display: flex; flex-direction: column; gap: 3px; }
  .crow { display: flex; justify-content: space-between; gap: 12px; width:100%;font:inherit;font-size:12px;text-align:left;color:var(--txt);cursor:help;
    background: rgba(10,12,18,.55); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
  .crow .l { color: var(--dim); }
  .crow .v { color: var(--gold2); font-weight: 700; }
  .talents { display: flex; gap: 4px; width: 100%; }
  .tal { flex: 1; background: rgba(10,12,18,.55); border: 1px solid var(--line); border-radius: 7px; padding: 4px 2px; }
  .tal .v { font-weight: 800; color: #fff; font-size: 13px; }
  .tal .l { font-size: 9.5px; color: var(--dim); }
  .weapons { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .legacy-warn { display: none; margin-top: 8px; font-size: 12px; line-height: 1.45; color: #ffd35c;
    background: rgba(64,48,10,.35); border: 1px solid #6d5a1f; border-radius: 9px; padding: 8px 10px; }
  .tipcard { position: fixed; z-index: 100; display: none; width: 288px; background: rgba(3,5,10,.96);
    border: 2px solid #4a4436; border-radius: 6px; padding: 9px 11px; font-size: 12px; line-height: 1.5;
    text-align: left; box-shadow: 0 10px 40px rgba(0,0,0,.7);max-height:80dvh;overflow:auto; }
  .tipcard b.nm { font-size: 13px; }
  .tipcard .tl { color: #9aa3b5; }
  .tipcard .body { margin-top: 6px; border-top: 1px solid #2a3049; padding-top: 5px; }
  .tipcard .body b { font-weight: 700; }
  .q0 { color: #9d9d9d; } .q1 { color: #fff; } .q2 { color: #1eff00; } .q3 { color: #0070dd; }
  .q4 { color: #a335ee; } .q5 { color: #ff8000; } .q6 { color: #e6cc80; }
  .import { display: flex; flex-direction: column; gap: 7px; height: 100%; overflow:hidden; }
  .import textarea { display:none; flex: 0 0 auto; height: 74px; background: #0a0c12; color: #9fb0d0; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px; font-family: ui-monospace, monospace; font-size: 11px; resize: none; }
  .import.paste-fallback textarea{display:block}
  .steps { display: flex; flex-direction: column; gap: 5px; }
  .step { display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; line-height: 1.35; }
  .step .n { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--gold);
    color: var(--gold2); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .export-copy{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;background:#0b0d14;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--dim)}
  #exportPart2{display:none}
  .export-copy .copy-btn{position:static;flex:0 0 auto}
  #heroFile{display:none}
  .hero-mobile-tabs{display:none;flex:0 0 auto;gap:6px}
  .hero-import-callout{position:absolute;z-index:5;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:11px 17px;border:1px solid #f1d178;border-radius:999px;background:#171720eF;color:#ffe69a;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 0 20px #f0ca5666;animation:hero-pulse 1.8s ease-in-out infinite;cursor:pointer}
  .hero-import-callout:before{content:"";width:8px;height:8px;border-radius:50%;background:#f2d47b;box-shadow:0 0 12px #f2d47b;animation:hero-dot 1s ease-in-out infinite alternate}
  @keyframes hero-pulse{50%{box-shadow:0 0 34px #f0ca56b5;filter:brightness(1.2)}}@keyframes hero-dot{to{opacity:.35;transform:scale(.75)}}
  .hero-import-dialog{width:min(640px,94vw);max-height:88dvh;margin:auto;padding:0;background:#141720;color:var(--txt);border:1px solid var(--gold);border-radius:14px;box-shadow:0 20px 70px #000d}
  .hero-import-dialog::backdrop{background:#05060bc7;backdrop-filter:blur(5px)}
  .hero-import-dialog .import{height:auto;max-height:88dvh;overflow:auto;padding:18px}
  .hero-import-dialog .import-head{display:flex;align-items:center;justify-content:space-between}
  .hero-import-dialog .import-head button{background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer}
  .import-progress{min-height:28px;padding:7px 10px;border:1px solid #51462e;border-radius:8px;background:#0b0d14;color:#c8c4b9;font-size:13px}
  .import-actions{display:flex;gap:8px;flex-wrap:wrap}.import-actions input[type=file]{display:none}
  @media (max-width: 980px) {
    .h-layout { grid-template-columns: minmax(0,1fr) !important; grid-template-rows: minmax(0,1fr); }
  }
  @media(max-width:700px){
    main.hero-main-container{gap:6px;padding:7px}
    .hero-mobile-tabs{display:flex}
    .h-layout{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)}
    .h-layout>.hero-panel{display:none;padding:9px;min-height:0}
    .h-layout>.hero-panel.active{display:flex}
    #doll{flex-direction:column;gap:4px}
  .char-head{margin-bottom:2px}.char-head .nm{font-size:16px}.char-head .sub{font-size:10px}.hero-util{width:32px;height:32px}
    .doll-grid{grid-template-columns:30px minmax(0,1fr) 30px;gap:2px}
    .doll-col{gap:2px}.slot{width:26px;height:26px}.slot img{width:22px;height:22px}
    .doll-center{gap:3px;padding:0 2px}
    .character-stage{height:clamp(210px,40vh,330px);min-height:210px;max-height:40vh;width:100%}
    .cstats{gap:2px}.crow{font-size:10px;padding:2px 6px}.tal{padding:2px}.tal .v{font-size:11px}.tal .l{font-size:8px}
    .weapons{margin-top:3px;gap:5px}.legacy-warn{margin-top:3px;padding:4px 6px;font-size:10px}
    .import{gap:5px}.import h2{margin-bottom:2px}.import textarea{height:54px;padding:5px;font-size:10px}
    .steps{gap:3px}.step{font-size:10px;line-height:1.25;gap:5px}.step .n{width:18px;height:18px;font-size:10px}
    .export-copy{padding:4px 6px;font-size:10px}
    .import>.btn,.import button{font-size:11px;padding:7px 9px}
  }
  @media(max-height:620px) and (max-width:700px){.character-stage{height:clamp(125px,24vh,190px);min-height:125px;max-height:24vh}.step{font-size:9px}.import textarea{height:42px}.h-layout>.hero-panel{padding:6px}#doll{overflow-y:auto}.doll-col{gap:1px}.slot{width:23px;height:23px}.slot img{width:19px;height:19px}}
  @media(max-height:560px) and (min-width:701px){.character-stage{height:clamp(250px,48vh,330px)}.slot{width:28px;height:28px}.slot img{width:23px;height:23px}.doll-col{gap:2px}.import textarea{height:48px}.steps{gap:3px}.step{font-size:10px}}
</style>
</head>
<body>
<div id="app">
<main class="hero-main-container">
  <div class="grid h-layout">
    <section class="card hero-panel active" id="doll">
      <div class="char-head">
        <button class="hero-util" id="levelNext" type="button" title="Следующий уровень" aria-label="Следующий уровень"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/><path d="M7 5h10M7 19h10"/></svg></button>
        <div><div class="nm" id="cname" data-ru="Твой герой" data-en="Your hero">Твой герой</div>
        <div class="sub" id="csub" data-ru="Образец персонажа" data-en="Character preview">Образец персонажа</div></div>
        <button class="hero-util" id="openHeroImport" type="button" title="Добавить или обновить героя" aria-label="Добавить или обновить героя"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
      </div>
      <div class="doll-grid" id="doll-grid"></div>
      <div class="legacy-warn" id="legacywarn"></div>
    </section>
</div>
<dialog class="hero-import-dialog" id="heroImportDialog">
    <section class="card import hero-panel">
      <div class="import-head"><h2><img class="ic" src="https://wow.zamimg.com/images/wow/icons/large/ability_warrior_battleshout.jpg" alt="">
        <span data-ru="Импорт из игры" data-en="Import from game">Импорт из игры</span>
        <span id="hintSlot"></span></h2><button id="closeHeroImport" aria-label="Close">×</button></div>
      <div class="steps"><div class="step"><span class="n" id="importStepNumber">1</span><div id="importInstruction">Скопируй команду, создай макрос в игре и запусти его.</div></div></div>
      <div class="export-copy"><span data-ru="Экспорт героя" data-en="Character export">Экспорт героя</span><span class="macro-box" id="m1"></span></div>
      <textarea id="paste" placeholder="WEXP1|…&#10;WEXP2|…"></textarea>
      <div class="import-progress" id="importProgress" aria-live="polite">Сначала запусти макрос «Экспорт · 1» в игре.</div>
      <div class="import-actions"><button class="btn" id="pasteClipboard" data-ru="Вставить ответ из игры" data-en="Paste response from game">Вставить ответ из игры</button></div>
    </section>
  </dialog>
</main>
</div>
<div class="tipcard" id="itemtip"></div>
<script src="assets/js/app.js?v=20261114d"></script>
<script src="assets/js/macros-data.js?v=20261114d"></script>
<script src="assets/js/talents-data.js"></script>
<script src="assets/data/wotlk-item-displayids.js"></script>
<script>
(() => {
  const lang = window.W.lang;
  const L = {
    ru: { copy: 'копировать',
      hint: 'Создай игровой макрос через Escape → Макросы или /macro. Запусти его, скопируй все строки WEXP из чата и вернись сюда.',
      err: 'Не нашёл строк WEXP|… — проверь, что скопировал их из чата целиком.',
      warn: '<b>Часть образов предметов недоступна</b> — данные героя загружены, но отдельные игровые модели могут не отображаться.',
      strength: 'Сила', agility: 'Ловкость', stamina: 'Выносливость',
      t0: 'Оружие', t1: 'Неистовство', t2: 'Защита',
      ilvlLine: 'Уровень предмета', lvl: 'Уровень', clsRu: { WARRIOR: 'Воин', PALADIN: 'Паладин', HUNTER: 'Охотник', ROGUE: 'Разбойник', PRIEST: 'Жрец', SHAMAN: 'Шаман', MAGE: 'Маг', WARLOCK: 'Колдун', DRUID: 'Друид', DEATHKNIGHT: 'Рыцарь смерти' },
      raceEn: {} },
    en: { copy: 'copy',
      hint: 'Create an in-game macro from Escape → Macros or /macro. Run it, copy all WEXP chat lines, then paste them here.',
      err: 'No WEXP|… lines found — make sure you copied them fully from chat.',
      warn: '<b>Some item appearances are unavailable</b> — character data loaded, but a few game models may be missing.',
      strength: 'Strength', agility: 'Agility', stamina: 'Stamina',
      t0: 'Arms', t1: 'Fury', t2: 'Protection',
      ilvlLine: 'Item level', lvl: 'Level',
      clsRu: {}, raceEn: { 'Человек': 'Human', 'Дворф': 'Dwarf', 'Ночной эльф': 'Night Elf', 'Гном': 'Gnome', 'Дреней': 'Draenei', 'Орк': 'Orc', 'Нежить': 'Undead', 'Таурен': 'Tauren', 'Тролль': 'Troll', 'Эльф крови': 'Blood Elf' } }
  };
  L.en.slots = () => ({ 1: 'Head', 2: 'Neck', 3: 'Shoulder', 15: 'Back', 5: 'Chest', 4: 'Shirt', 19: 'Tabard', 9: 'Wrist', 10: 'Hands', 6: 'Waist', 7: 'Legs', 8: 'Feet', 11: 'Finger', 12: 'Finger', 13: 'Trinket', 14: 'Trinket', 16: 'Main hand', 17: 'Off hand', 18: 'Ranged' });
  L.ru.slots = () => ({ 1: 'Голова', 2: 'Шея', 3: 'Плечи', 15: 'Спина', 5: 'Грудь', 4: 'Рубашка', 19: 'Гербовая накидка', 9: 'Запястья', 10: 'Кисти рук', 6: 'Пояс', 7: 'Ноги', 8: 'Ступни', 11: 'Кольцо', 12: 'Кольцо', 13: 'Аксессуар', 14: 'Аксессуар', 16: 'Правая рука', 17: 'Левая рука', 18: 'Дальний бой' });

  // in-game character pane layout (WotLK)
  const LEFT  = [1, 2, 3, 15, 5, 4, 19, 9];
  const RIGHT = [10, 6, 7, 8, 11, 12, 13, 14];
  const WEAPONS = [16, 17, 18];
  const SLOT_ICONS = {
    1: 'inv_helmet_04', 2: 'inv_jewelry_necklace_11', 3: 'inv_shoulder_09', 4: 'inv_shirt_05',
    5: 'inv_chest_plate04', 6: 'inv_belt_05', 7: 'inv_pants_04', 8: 'inv_boots_05',
    9: 'inv_bracer_07', 10: 'inv_gauntlets_04', 11: 'inv_jewelry_ring_01', 12: 'inv_jewelry_ring_04',
    13: 'inv_jewelry_talisman_04', 14: 'inv_jewelry_talisman_01', 15: 'inv_misc_cape_18',
    16: 'inv_sword_10', 17: 'inv_shield_04', 18: 'inv_weapon_crossbow_01', 19: 'inv_shirt_guildtabard_01'
  };
  const QCOL = { 0: '#9d9d9d', 1: '#fff', 2: '#1eff00', 3: '#0070dd', 4: '#a335ee', 5: '#ff8000', 6: '#e6cc80' };

  const $ = id => document.getElementById(id);
  const state = { char: null, gear: {}, tips: {}, legacy: false, imported: false };

  function macroRun(file) {
    return ((((window.MACRO_TXT || {})[lang] || {})[file] || '')
      .split('\n').filter(l => l.startsWith('/run')).join('\n'));
  }
  function texIcon(tex) {
    const name = (tex || '').split(/[\\/]+/).pop().toLowerCase();
    return name ? window.W.icon(name) : '';
  }
  function itemIcon(g, slot) {
    if (g && g.tex) return texIcon(g.tex);
    if (g && g.id && state.tips[g.id] && state.tips[g.id].icon) return window.W.icon(state.tips[g.id].icon);
    return window.W.icon(SLOT_ICONS[slot] || 'inv_misc_questionmark');
  }

  function init() {
    document.querySelectorAll('[data-ru]').forEach(el => { el.textContent = el.getAttribute('data-' + lang) || el.textContent; });
    document.title = (lang === 'ru' ? 'Герой' : 'Hero') + ' — WoW 3.3.5 Fury';
    $('hintSlot').innerHTML = window.W.hint(L[lang].hint, true);
    const m1 = macroRun('export-character');
    $('m1').innerHTML = `<button class="copy-btn" id="copyM1" data-copy="${encodeURIComponent(m1)}" data-copy-label="${lang==='ru'?'Экспорт героя':'Character export'}" data-copy-success="${lang==='ru'?'✓ Скопировано':'Copied'}">${lang==='ru'?'Копировать команду':'Copy command'}</button>`;
    $('importStepNumber').textContent='1';
    $('importInstruction').textContent=lang==='ru'
      ?'Скопируй команду. В игре открой Escape → Макросы (или /macro), создай макрос, вставь команду и запусти его.'
      :'Copy the command. In game open Escape → Macros (or /macro), create a macro, paste the command and run it.';
    $('pasteClipboard').textContent=lang==='ru'?'Вставить данные из чата':'Paste chat data';
    drawDoll();
    let pasteTimer;
    $('paste').addEventListener('input',()=>{clearTimeout(pasteTimer);pasteTimer=setTimeout(()=>parse(true),180);});
    $('pasteClipboard').onclick=async()=>{try{const text=await navigator.clipboard.readText();if(!/WEXP[12]\|/.test(text)){ $('importProgress').textContent=lang==='ru'?'Сначала запусти игровой макрос и скопируй все строки WEXP из чата.':'Run the in-game macro first, then copy all WEXP chat lines.';return;}$('paste').value=text.trim();parse(true);}catch(_){document.querySelector('.import').classList.add('paste-fallback');$('importInstruction').textContent=lang==='ru'?'Вставь все строки WEXP из игрового чата в поле ниже. Герой обновится автоматически.':'Paste all WEXP lines from game chat below. The character updates automatically.';$('paste').focus();}};
    $('openHeroImport').onclick=()=>{ $('paste').value='';$('importProgress').textContent=lang==='ru'?'Шаг 1 из 2 · скопируй команду и запусти игровой макрос.':'Step 1 of 2 · copy the command and run the in-game macro.';$('heroImportDialog').showModal();};
    $('m1').addEventListener('click',e=>{if(e.target.closest('#copyM1')){$('importProgress').textContent=lang==='ru'?'Команда скопирована · шаг 1 из 2. Создай игровой макрос, запусти его и скопируй ответ из чата.':'Command copied · step 1 of 2. Create and run the macro, then copy its chat output.';$('importInstruction').textContent=lang==='ru'?'Шаг 2: скопируй из игрового чата все строки WEXP, вернись сюда и нажми «Вставить данные из чата».':'Step 2: copy all WEXP lines from game chat, return here and choose “Paste chat data”.';}});
    $('doll').addEventListener('click',e=>{if(e.target.closest('.hero-import-callout'))$('heroImportDialog').showModal();});
    $('closeHeroImport').onclick=()=>$('heroImportDialog').close();
    $('heroImportDialog').addEventListener('click',e=>{if(e.target===$('heroImportDialog'))$('heroImportDialog').close();});
    $('levelNext').title=lang==='ru'?'ЛКМ: следующий уровень · ПКМ или удержание: предыдущий. Экипировка не меняется.':'Left click: next level · right click or hold: previous. Gear stays the same.';
    const changeLevel=delta=>{if(!state.char)return;state.char.lvl=Math.max(1,Math.min(80,state.char.lvl+delta));$('csub').textContent=`${L[lang].lvl} ${state.char.lvl} · ${lang==='ru'?'просмотр уровня':'level preview'}`;$('levelNext').disabled=state.char.lvl>=80;window.W.sound(delta>0?'success':'click');};
    let suppressLevelClick=false;
    $('levelNext').onclick=()=>{if(suppressLevelClick){suppressLevelClick=false;return;}changeLevel(1);};
    $('levelNext').oncontextmenu=e=>{e.preventDefault();changeLevel(-1);};
    let levelHoldTimer=0;
    $('levelNext').onpointerdown=e=>{if(e.pointerType==='touch')levelHoldTimer=setTimeout(()=>{changeLevel(-1);suppressLevelClick=true;levelHoldTimer=0;},500);};
    ['pointerup','pointercancel','pointerleave'].forEach(type=>$('levelNext').addEventListener(type,()=>{clearTimeout(levelHoldTimer);levelHoldTimer=0;}));
    // Restore the last imported character; otherwise show the sample character.
    const saved=localStorage.getItem('wheroData');
    $('paste').value = saved || DEMO.join('\n');
    parse(true, !saved);
    $('paste').value = '';
  }
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function parse(silent = false, isDemo = false) {
    const lines = $('paste').value.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const char = { name: '?', cls: 'WARRIOR', lvl: 0, race: '', raceId: 1, gender: 1, str: 0, agi: 0, sta: 0, tal: [0, 0, 0] };
    const gear = {};
    let found = false, hasCharacter=false, hasRace=false, hasGear=false, legacy = false;
    for (const ln of lines) {
      const m = ln.match(/^WEXP([012])\|(.*)$/);
      if (!m) continue;
      found = true;
      const p = m[2].split('|');
      if (m[1] === '1') {
        hasCharacter=true;
        char.name = p[0];
        if (/^\d+$/.test(p[1] || '') && p.length >= 7) {
          // Compact one-command export: name, level, race, sex, Strength, Agility, Stamina.
          char.cls='WARRIOR';char.lvl=+p[1]||1;char.race=p[2]||'';char.gender=(+p[3]===3)?1:0;
          char.str=+p[4]||0;char.agi=+p[5]||0;char.sta=+p[6]||0;char.tal=null;hasRace=true;
          const raceIds={'Человек':1,'Human':1,'Орк':2,'Orc':2,'Дворф':3,'Дварф':3,'Dwarf':3,'Ночной эльф':4,'Night Elf':4,'Нежить':5,'Undead':5,'Forsaken':5,'Таурен':6,'Tauren':6,'Гном':7,'Gnome':7,'Тролль':8,'Troll':8,'Эльф крови':10,'Blood Elf':10,'Дреней':11,'Draenei':11};
          char.raceId=raceIds[char.race]||1;
        } else {
          char.cls = p[1] || 'WARRIOR'; char.lvl = +p[2] || 0;
          if (p[6]) { char.str=+p[3]||0;char.agi=+p[4]||0;char.sta=+p[5]||0;char.tal=p[6].split('/').map(Number); }
          else { char.legacyStats=true;char.ap=+p[3]||0;char.hp=+p[4]||0;if(p[5])char.tal=p[5].split('/').map(Number); }
        }
      } else if (m[1] === '0') {
        hasRace=true;
        char.race = p[0] || '';
        const raceIds={'Человек':1,'Human':1,'Орк':2,'Orc':2,'Дворф':3,'Дварф':3,'Dwarf':3,'Ночной эльф':4,'Night Elf':4,'Нежить':5,'Undead':5,'Forsaken':5,'Таурен':6,'Tauren':6,'Гном':7,'Gnome':7,'Тролль':8,'Troll':8,'Эльф крови':10,'Blood Elf':10,'Дреней':11,'Draenei':11};
        char.raceId=raceIds[char.race]||1; char.gender=(+p[1]===3)?1:0;
      } else {
        hasGear=true;
        const slot = +p[0];
        if (p.length >= 6 && /^\d+$/.test(p[1] || '') && /^\d+$/.test(p[2] || '') && /^\d+$/.test(p[3] || '') && /icons/i.test(p[4] || '')) {
          // WEXP2|slot|rarity|ilvl|itemid|texture|name
          const itemId=+p[3];
          gear[slot] = { q: +p[1], ilvl: +p[2], id: itemId, displayId: +(window.WOTLK_ITEM_DISPLAY_IDS||{})[itemId]||0, inventoryType: +(window.WOTLK_ITEM_INVENTORY_TYPES||{})[itemId]||0, tex: p[4], name: p.slice(5).join('|') };
        } else {
          const link = p.slice(1).join('|');
          const im = link.match(/item:(\d+)/), nm = link.match(/\[([^\]]*)\]/);
          const itemId=im?+im[1]:0,displayId=+(window.WOTLK_ITEM_DISPLAY_IDS||{})[itemId]||0;
          const color=(link.match(/\|c([0-9a-f]{8})/i)||[])[1]?.slice(2).toLowerCase();
          const rarity=({'9d9d9d':0,'ffffff':1,'1eff00':2,'0070dd':3,'a335ee':4,'ff8000':5,'e6cc80':6})[color];
          gear[slot] = { id:itemId, displayId, inventoryType:+(window.WOTLK_ITEM_INVENTORY_TYPES||{})[itemId]||0, q:rarity, name: nm ? nm[1] : link.replace(/[\[\]]/g, '') };
          if(!displayId)legacy=true;
        }
      }
    }
    if (!found) { if(!silent) alert(L[lang].err); return; }
    if(!hasCharacter||!hasRace){
      $('importProgress').textContent=!hasCharacter
        ? (lang==='ru'?'Жду строку WEXP1 с именем, уровнем и характеристиками.':'Waiting for the WEXP1 character line.')
        : (lang==='ru'?'Не найдена строка с расой. Скопируй весь ответ игрового макроса целиком.':'Race data is missing. Copy all output from the in-game macro.');
      return;
    }
    const partialImport=!hasGear;
    state.char = char; state.gear = gear; state.legacy = legacy;
    if(!isDemo){state.imported=true;localStorage.setItem('wheroData',lines.join('\n'));}
    drawDoll();
    if(!isDemo){
      $('importProgress').textContent=partialImport
        ? (lang==='ru'?'Персонаж загружен, но экипировка не найдена. Проверь, что скопировал все строки ответа.':'Character loaded, but no equipment lines were found. Make sure you copied the full response.')
        : (lang==='ru'?'Герой добавлен.':'Character added.');
      if(!silent)window.W.sound(partialImport?'click':'success');
      if(!partialImport)$('heroImportDialog').close();
    }
    loadItemTips();
    if(window.renderWowCharacter) window.renderWowCharacter(state.char,state.gear);
    else window.pendingWowCharacter={char:state.char,gear:state.gear};
  }

  function drawDoll() {
    const T = L[lang];
    const c = state.char;
    const grid = $('doll-grid');
    const mk = slot => {
      const g = state.gear[slot];
      const d = document.createElement('div');
      d.className = 'slot' + (g ? ' has' : ' empty');
      d.dataset.slot = slot;
      d.innerHTML = `<img src="${itemIcon(g, slot)}" alt="">`;
      d.querySelector('img').dataset.fallbackSrc=({11:'assets/icons/ring-slot-1.svg',12:'assets/icons/ring-slot-2.svg'})[slot]||window.W.icon(SLOT_ICONS[slot]||'inv_misc_questionmark');
      if (g && g.q != null) d.style.borderColor = QCOL[g.q] || '#4a4436';
      d.onmouseenter = () => showTip(d, slot);
      d.onmouseleave = hideTip;
      return d;
    };
    const col = arr => { const w = document.createElement('div'); w.className = 'doll-col'; arr.forEach(s => w.appendChild(mk(s))); return w; };
    // center panel
    const center = document.createElement('div');
    center.className = 'doll-center';
    const clsRu = T.clsRu[c && c.cls] || (c && c.cls) || '...';
    const race = c && c.race ? (lang === 'en' ? (T.raceEn[c.race] || c.race) : c.race) : '';
    center.innerHTML = `
      <div class="character-stage" id="character-stage" role="img" aria-label="${lang==='ru'?'Трёхмерная модель персонажа World of Warcraft':'World of Warcraft 3D character model'}">
        <div id="wow-model"></div><span class="model-status" id="model-status"></span>
        ${state.imported?'':`<button class="hero-import-callout" type="button">${lang==='ru'?'Добавить своего героя':'Add your character'}</button>`}
      </div>
      <div class="weapons" id="weapons"></div>
      <div class="cstats">
        ${c && !c.legacyStats ? `<button class="crow" type="button" title="${lang==='ru'?'Текущая сила персонажа из игрового экспорта.':'Current Strength from the game export.'}"><span class="l">${T.strength}</span><span class="v">${c.str}</span></button>
        <button class="crow" type="button" title="${lang==='ru'?'Текущая ловкость персонажа из игрового экспорта.':'Current Agility from the game export.'}"><span class="l">${T.agility}</span><span class="v">${c.agi}</span></button>
        <button class="crow" type="button" title="${lang==='ru'?'Текущая выносливость персонажа из игрового экспорта.':'Current Stamina from the game export.'}"><span class="l">${T.stamina}</span><span class="v">${c.sta}</span></button>` : c && `<button class="crow" type="button"><span class="l">${lang==='ru'?'Старый экспорт':'Legacy export'}</span><span class="v">${lang==='ru'?'обнови':'update'}</span></button>`}
      </div>
      ${c && c.tal ? `<div class="talents">
        <div class="tal"><div class="v">${c.tal[0] || 0}</div><div class="l">${T.t0}</div></div>
        <div class="tal"><div class="v">${c.tal[1] || 0}</div><div class="l">${T.t1}</div></div>
        <div class="tal"><div class="v">${c.tal[2] || 0}</div><div class="l">${T.t2}</div></div>
      </div>` : ''}`;
    grid.innerHTML = '';
    grid.appendChild(col(LEFT));
    grid.appendChild(center);
    grid.appendChild(col(RIGHT));
    const wp = $('weapons');
    wp.innerHTML = '';
    WEAPONS.forEach(s => wp.appendChild(mk(s)));
    // header
    if (c) {
      $('cname').textContent = c.name;
      $('csub').textContent = `${T.lvl} ${c.lvl} ${race ? race + ', ' : ''}${clsRu}`;
      $('levelNext').disabled=c.lvl>=80;
    }
    const warn = $('legacywarn');
    warn.style.display = state.legacy ? 'block' : 'none';
    warn.innerHTML = T.warn;
  }

  async function loadItemTips() {
    const jobs = Object.entries(state.gear).filter(([s, g]) => g && g.id && !state.tips[g.id]);
    for (const [slot, g] of jobs) {
      fetch(`https://nether.wowhead.com/wotlk/tooltip/item/${g.id}?locale=${lang}`)
        .then(r => r.ok ? r.json() : null)
        .then(j => {
          if (!j) return;
          state.tips[g.id] = j;
          const displayId=+(j.displayId||j.displayid||j.display_id||0);
          if(displayId){g.displayId=displayId;window.updateWowGearItem?.(+slot,g);}
          const d = document.querySelector(`.slot[data-slot="${slot}"]`);
          if (!d) return;
          if (!g.tex && !d.querySelector('img').dataset.iconFallback && j.icon) {
            d.querySelector('img').src = window.W.icon(j.icon);
          }
          if (g.q == null && j.quality != null) d.style.borderColor = QCOL[j.quality] || '#4a4436';
        }).catch(() => {});
    }
  }

  function cleanTip(html) {
    return html
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<th[\s\S]*?<\/th>/g, '')
      .replace(/<\/?table[^>]*>/g, '<br>')
      .replace(/<\/?tbody>/g, '')
      .replace(/<tr[^>]*>/g, '')
      .replace(/<td[^>]*>/g, '').replace(/<\/td>/g, '<br>')
      .replace(/<\/tr>/g, '')
      .replace(/<a[^>]*>/g, '').replace(/<\/a>/g, '')
      .replace(/<div[^>]*>/g, '').replace(/<\/div>/g, '<br>')
      .replace(/<\/?span[^>]*>/g, '')
      .replace(/<br\s*\/?>/gi, '<br>')
      .replace(/(<br>\s*)+/g, '<br>')
      .replace(/^(<br>|\s)+/, '')
      .replace(/^<b[^>]*>[^<]*<\/b>/, '')
      .replace(/<br>\s*(Уровень предмета|Item Level)\s*:?\s*\d+/gi, '')
      .replace(/\)(?=[А-ЯЁA-Z])/g, ')<br>')
      .replace(/^(<br>|\s)+/, '').replace(/(<br>|\s)+$/, '')
      .trim();
  }

  function showTip(el, slot) {
    const T = L[lang], slots = T.slots();
    const g = state.gear[slot];
    const tip = $('itemtip');
    if (!g) {
      tip.innerHTML = `<b class="nm" style="color:#fff">${slots[slot]}</b>`;
    } else {
      const t = g.id ? state.tips[g.id] : null;
      const q = g.q != null ? g.q : (t ? t.quality : 1);
      const nm = (t && t.name) || g.name || '#' + (g.id || '');
      let html = `<b class="nm q${q}">${esc(nm)}</b><br>`;
      if (g.ilvl) html += `<span class="tl">${T.ilvlLine} ${g.ilvl}</span><br>`;
      html += `<span class="tl">${slots[slot]}</span>`;
      if (t && t.tooltip) html += `<div class="body">${cleanTip(t.tooltip)}</div>`;
      else if (g.id) html += `<div class="body"><span class="tl">…</span></div>`;
      tip.innerHTML = html;
    }
    tip.style.display = 'block';
    const r = el.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = r.right + 10, y = r.top;
    if (x + tw > innerWidth - 8) x = Math.max(8, r.left - tw - 10);
    if (y + th > innerHeight - 8) y = Math.max(8, innerHeight - th - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function hideTip() { $('itemtip').style.display = 'none'; }

  const DEMO = ['WEXP1|Новичок|1|Human|2|0|0|0'];

  init();
})();
</script>
<script src="assets/js/modelviewer-config.js"></script>
<script type="module">
  try {
    const loadScript=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');const timer=setTimeout(()=>reject(new Error('Timed out loading '+src)),15000);s.src=src;s.onload=()=>{clearTimeout(timer);resolve();};s.onerror=()=>{clearTimeout(timer);reject(new Error('Failed to load '+src));};document.head.appendChild(s);});
    const modelAssetBase=window.WOW_MODELVIEWER_PROXY||'https://wow.zamimg.com/';
    window.CONTENT_PATH=modelAssetBase+'modelviewer/live/';
    window.WOTLK_TO_RETAIL_DISPLAY_ID_API='https://wotlk.murlocvillage.com/api/items';
    await Promise.all([loadScript('https://code.jquery.com/jquery-3.7.1.min.js'),loadScript(`${window.CONTENT_PATH}viewer/viewer.min.js`)]);
    await loadScript('assets/js/vendor/wow-model-viewer.bundle.js');
    const {generateModels}=window.WowModelViewerBundle;
    let activeModel=null, modelRequest=0;
    const convertedItems=new Map(Object.entries(JSON.parse(localStorage.getItem('wotlkDisplayIds')||'{}')));
    const pendingGearItems=new Map();
    const lockModelInput=host=>{
      if(host.dataset.inputLocked)return;
      host.dataset.inputLocked='1';
      host.addEventListener('wheel',e=>{e.preventDefault();e.stopImmediatePropagation();},{capture:true,passive:false});
      host.addEventListener('mousedown',e=>{if(e.button===2||e.ctrlKey){e.preventDefault();e.stopImmediatePropagation();}},true);
      host.addEventListener('contextmenu',e=>{e.preventDefault();e.stopImmediatePropagation();},true);
      host.addEventListener('dblclick',e=>{e.preventDefault();e.stopImmediatePropagation();},true);
      host.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{capture:true,passive:false});
    };
    async function liveDisplayId(itemId,classicDisplayId){
      const key=itemId+':'+classicDisplayId;
      if(convertedItems.has(key))return +convertedItems.get(key);
      try{
        const response=await fetch(`${window.WOTLK_TO_RETAIL_DISPLAY_ID_API}/${itemId}/${classicDisplayId}`);
        if(response.ok){const data=await response.json();const id=+(data.newDisplayId||data.data?.newDisplayId||0);if(id){convertedItems.set(key,id);localStorage.setItem('wotlkDisplayIds',JSON.stringify(Object.fromEntries(convertedItems)));return id;}}
      }catch(error){console.warn('WotLK display conversion failed:',itemId,error);}
      convertedItems.set(key,classicDisplayId);
      return classicDisplayId;
    }
    window.renderWowCharacter=async(char,gear)=>{
      const stage=document.getElementById('character-stage'),host=document.getElementById('wow-model'),status=document.getElementById('model-status');
      if(!char||!char.raceId)return;
      lockModelInput(host);
      const request=++modelRequest;
      pendingGearItems.clear();
      if(activeModel?.destroy)activeModel.destroy();
      host.replaceChildren();stage.classList.remove('model-ready');status.textContent=window.W.lang==='ru'?'Загрузка модели WoW…':'Loading WoW model…';
      try{
        // Render the character body first. Item conversion endpoints are slow or
        // unavailable on some Pages visitors; never let optional gear block the model.
        const modelOptions={race:char.raceId,gender:char.gender,skin:0,face:0,hairStyle:0,hairColor:0,facialStyle:0,items:[],hideProgressBar:false};
        let nextModel;
        try{nextModel=await generateModels(1.25,'#wow-model',modelOptions,'live');}
        catch(proxyError){
          const direct='https://wow.zamimg.com/modelviewer/live/';
          if(window.CONTENT_PATH===direct)throw proxyError;
          console.warn('Model proxy failed; retrying against Wowhead CDN:',proxyError);
          host.replaceChildren();
          window.CONTENT_PATH=direct;
          nextModel=await generateModels(1.25,'#wow-model',modelOptions,'live');
        }
        if(request!==modelRequest){nextModel?.destroy?.();return;}
        activeModel=nextModel;
        activeModel.setDistance(innerWidth>700?21:19);
        const fixedZenith=activeModel.getZenith?.()??activeModel.renderer?.zenith;
        const lockVerticalOrbit=()=>{if(activeModel!==window.activeWowModel)return;if(Number.isFinite(fixedZenith)&&activeModel.renderer&&activeModel.renderer.zenith!==fixedZenith)activeModel.setZenith(fixedZenith);requestAnimationFrame(lockVerticalOrbit);};
        requestAnimationFrame(lockVerticalOrbit);
        window.activeWowModel=activeModel;
        const attachGearItem=async(slot,g,model=activeModel)=>{
          if(!model||!g?.id||!g?.displayId)return;
          const displaySlot=({16:21,17:22,18:15}[+slot]||(g.inventoryType===16?15:g.inventoryType===20?20:g.inventoryType||+slot));
          const displayId=await liveDisplayId(g.id,g.displayId);
          if(model!==activeModel)return;
          if(!model.renderer?.actors?.length){pendingGearItems.set(+slot,g);return;}
          try{model.updateItemViewer(displaySlot,displayId,0);}catch(error){console.warn('Could not attach WoW item model:',displaySlot,displayId,error);}
        };
        window.updateWowGearItem=(slot,g)=>attachGearItem(slot,g);
        let checks=0;
        const waitForCharacter=()=>{
          if(request!==modelRequest)return;
          if(activeModel?.renderer?.actors?.length){
            stage.classList.add('model-ready');status.textContent='';
            for(const [slot,g] of Object.entries(gear))if(g?.id&&g?.displayId&&![2,11,12,13,14].includes(+slot))void attachGearItem(slot,g,activeModel);
            for(const [slot,g] of pendingGearItems)void attachGearItem(slot,g,activeModel);
            pendingGearItems.clear();
            return;
          }
          if(++checks<120){setTimeout(waitForCharacter,100);return;}
          status.textContent=window.W.lang==='ru'?'Игровая 3D-модель не загрузилась.':'The in-game 3D model did not load.';
        };
        waitForCharacter();
      }catch(error){
        if(request!==modelRequest)return;
        status.textContent=window.W.lang==='ru'?'Не удалось загрузить 3D-модель из игрового сервиса. Проверь подключение и обнови страницу.':'The 3D model service did not return the character. Check your connection and reload the page.';
        console.warn('WoW character model failed:',error);
      }
    };
    if(window.pendingWowCharacter)window.renderWowCharacter(window.pendingWowCharacter.char,window.pendingWowCharacter.gear);
  }catch(error){
    const status=document.getElementById('model-status');if(status)status.textContent=window.W.lang==='ru'?'Просмотрщик WoW сейчас недоступен.':'WoW model viewer is currently unavailable.';
    console.warn('Could not load WoW model viewer:',error);
  }
</script>
