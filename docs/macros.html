        ['Удар щитом по наведению','Прерывание; нужен щит и боевая или защитная стойка.','#showtooltip Удар щитом\n/cast [nostance:1,nostance:2]Оборонительная стойка\n/cast [@mouseover,harm,nodead][]Удар щитом','inv_shield_05']
      ]:[
        ['Threat priority','Shield Slam → Revenge → Devastate; press repeatedly.','#showtooltip Shield Slam\n/startattack\n/cast Shield Slam\n/cast Revenge\n/cast Devastate','ability_warrior_shieldslam'],
        ['Area threat','Thunder Clap and Shockwave; stance change may take a press.','#showtooltip Thunder Clap\n/cast [nostance:2]Defensive Stance\n/cast Thunder Clap\n/cast Shockwave','ability_thunderclap'],
        ['Mouseover Taunt','Taunt the enemy under your cursor without changing target.','#showtooltip Taunt\n/cast [@mouseover,harm,nodead][]Taunt','spell_nature_reincarnation'],
        ['Mouseover Shield Bash','Interrupt; requires a shield and Battle or Defensive Stance.','#showtooltip Shield Bash\n/cast [nostance:1,nostance:2]Defensive Stance\n/cast [@mouseover,harm,nodead][]Shield Bash','inv_shield_05']
      ]);
    MACROS=rows.map(([title,sub,body,icon],i)=>({file:'custom-'+i,icon,body:window.WARRIOR_MACRO_BODIES?.[spec]?.[lang]?.[i]||body,index:i,[lang]:[title,sub],tags:{[lang]:i===0?(spec==='arms'?(lang==='ru'?['фокус','прерывание']:['focus','interrupt']):(lang==='ru'?['угроза','приоритет']:['threat','priority'])):(lang==='ru'?['ситуационно','без фиксированных клавиш']:['situational','no fixed binds'])},feats:{[lang]:(quickFlows[spec]?.[lang]?.[i]||[]).map(([iconName,label])=>({i:iconName,t:label,d:sub}))},note:{[lang]:spec==='arms'?(lang==='ru'?'Макрос проверяет команды при каждом нажатии, но не распознаёт нужный момент для контроля. Смена стойки может потребовать ещё одного нажатия.':'The macro checks commands only when pressed and cannot choose the right control timing. A stance change may require another press.'):(lang==='ru'?'Это список попыток, а не автоматическая ротация. Следи за угрозой, стойкой, щитом и яростью.':'This is an ordered attempt list, not an automatic rotation. Watch threat, stance, shield, and rage.')}}));
  }
  const sharedLabels=window.WARRIOR_MACRO_LABELS?.[spec]?.[lang]||[];
  MACROS=MACROS.map((m,i)=>{const label=sharedLabels[i];return label?{...m,icon:label[2],[lang]:[label[0],label[1]]}:m;});
  const wrap = document.getElementById('cards');
  const rows = [];
  for (const m of MACROS) {
    const body = (m.body || (((window.MACRO_TXT || {})[lang] || {})[m.file] || '')).trim();
    const [name, sub] = m[lang];
    const tags = (m.tags[lang] || []).map(t => `<span class="tag">${t}</span>`).join('');
    const cueSource=(m.feats[lang]||[]).slice(0,4);
    const cues=cueSource.length?cueSource.map(f=>`<div class="m-cue"><img src="${I(f.i)}" alt=""><span>${f.t}</span></div>`).join(''):`<div class="m-cue"><img src="${I(m.icon)}" alt=""><span>${sub}</span></div>`;
    const feats = (m.feats[lang] || []).map(f =>
      `<div class="mf"><img src="${I(f.i)}" alt=""><div class="t"><b>${f.t}</b> — ${f.d}</div></div>`).join('');
    rows.push(`
    <section class="card m-card">
      <div class="m-head">
        <img src="${I(m.icon)}" alt="">
        <div class="t"><b>${name}</b><span>${sub}</span></div>

      </div>
      <div class="macro-box"><button class="copy-btn" data-copy="${encodeURIComponent(body)}">${L.copy}</button>
      <pre>${body.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</pre></div>
      <div class="m-meta">${tags}</div>
      <p class="m-card-context">${m.note[lang]}</p>
      <div class="m-cues">${cues}</div>
      <div class="m-extra" hidden><div class="m-feats">${feats}</div><div class="m-note">${m.note[lang]}</div></div>
    </section>`);
  }
  wrap.innerHTML = rows.join('');
  wrap.classList.toggle('count-4',MACROS.length===4);
  const tabs=document.getElementById('macroTabs');
  tabs.innerHTML=MACROS.map((m,i)=>`<button class="${i===0?'on':''}" data-macro="${i}">${m[lang][0]}</button>`).join('');
  wrap.querySelectorAll('.m-card').forEach((card,i)=>{
    const openDetails=()=>{
      document.getElementById('macroDetailsTitle').textContent=MACROS[i][lang][0];
      const npc=`<div class="npc-dialog"><img src="${I(['npc_undead_male_warrior','npc_human_male_warrior','npc_orc_male_warrior'][i%3])}" onerror="this.src='${I('ability_warrior_battleshout')}'" alt=""><span><b>${lang==='ru'?'Наставник воинов':'Warrior Trainer'}</b>${lang==='ru'?'Скопируй текст ниже и создай макрос в игре.':'Copy the text below and create an in-game macro.'}</span></div>`;
      document.getElementById('macroDetailsBody').innerHTML=npc+card.querySelector('.macro-box').outerHTML+card.querySelector('.m-extra').innerHTML+`<p class="m-note">${lang==='ru'?'В игре открой меню Escape → Макросы или введи /macro. Создай макрос, вставь текст, выбери значок и перетащи его на панель действий. Назначь ему любую удобную клавишу в настройках игры. Обычный макрос не выполняет всю ротацию одним нажатием.':'In game, press Escape → Macros or type /macro. Create a macro, paste the text, choose an icon, and drag it to your action bar. Bind any key you prefer in the game settings. A normal macro cannot run the full rotation with one press.'}</p>`;
      document.getElementById('macroDetails').showModal();
    };
    card.setAttribute('role','button');card.tabIndex=0;
    card.onclick=event=>{if(event.target.closest('[data-copy]'))return;openDetails()};
    card.onkeydown=event=>{if((event.key==='Enter'||event.key===' ')&&!event.target.closest('[data-copy]')){event.preventDefault();openDetails();}};
  });
  document.getElementById('closeMacroDetails').onclick=()=>document.getElementById('macroDetails').close();
});
</script>
</body>
</html>
