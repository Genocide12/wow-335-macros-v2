<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гайд — WoW 3.3.5 Fury</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .g-shell{min-height:0;flex:1;display:flex;flex-direction:column;gap:10px;overflow:hidden}
  .g-head{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .g-head h2{margin:0;color:var(--gold2);font-size:18px}
  .g-head p{font-size:11px;color:var(--dim);margin-top:3px}
  .g-select{margin-left:auto;max-width:270px;background:#11141d;color:var(--gold2);border:1px solid var(--gold);border-radius:9px;padding:9px;font-weight:700}
  .g-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(62px,1fr);gap:8px;min-height:0;overflow:hidden}
  .g-item{display:flex;align-items:center;gap:10px;text-align:left;padding:9px;background:linear-gradient(140deg,#242533,#141720);color:var(--txt);border:1px solid var(--line);border-radius:10px;cursor:pointer;min-width:0;overflow:hidden}
  .g-item:hover{border-color:var(--gold)}
  .g-item img{width:36px;height:36px;border-radius:8px;flex:0 0 auto}
  .g-item .t{min-width:0}.g-item b{display:block;color:#fff;font-size:12.5px}
  .g-item span{display:block;color:var(--dim);font-size:10.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .g-bottom{display:flex;justify-content:flex-end}
  .g-dialog{width:min(720px,92vw);max-height:82dvh;margin:auto;padding:0;background:#141720;color:var(--txt);border:1px solid var(--gold);border-radius:14px;box-shadow:0 20px 70px #000d}
  .g-dialog::backdrop{background:#05060bbd;backdrop-filter:blur(4px)}
  .g-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--gold2);font-weight:800}
  .g-dialog-head button{background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer}
  .g-dialog-body{padding:14px 16px;overflow:auto;max-height:calc(82dvh - 52px);font-size:13px;line-height:1.55}
  .g-dialog-body p{margin:8px 0}.g-dialog-body b{color:var(--gold2)}
  .g-spells{display:flex;gap:6px;flex-wrap:wrap}.g-spells img{width:32px;height:32px;border-radius:7px}
  @media(max-width:860px){.g-items{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(55px,1fr);gap:5px}.g-shell{gap:6px}.g-head h2{font-size:15px}.g-item{padding:6px;gap:7px}.g-item img{width:29px;height:29px}.g-item b{font-size:11px}.g-item span{font-size:9.5px}.g-select{max-width:48%;padding:7px;font-size:11px}}
  @media(max-width:420px){.g-items{grid-template-columns:1fr;grid-auto-rows:minmax(40px,1fr)}.g-item span{display:none}.g-item img{width:25px;height:25px}.g-item{padding:4px 7px}.g-select{max-width:50%}}
</style>
</head>

  const D = lang === 'ru' ? R : E;

  const categories=[
    ['fight',D.fightTitle,D.fight],['surv',D.survTitle,D.surv],['tg',D.tgTitle,D.tg],
    ['rot',D.rotTitle,D.rot],['auto',lang==='ru'?'Работа макросов':'Macro behavior',D.auto],['learn',D.learnTitle,D.learn]
  ];
  const select=document.getElementById('guideCategory');
  select.innerHTML=categories.map(([key,title])=>`<option value="${key}">${title}</option>`).join('');
  document.getElementById('guideTitle').textContent=D.title;
  document.getElementById('guideSubtitle').textContent=D.subtitle;
  const items=document.getElementById('guideItems');
  const dialog=document.getElementById('guideDialog');
  const clean=s=>(s||'').replace(/<[^>]*>/g,'').replace(/&gt;/g,'>').replace(/&lt;/g,'<');
  const openEntry=(p)=>{
    document.getElementById('guideDialogTitle').textContent=p.name;
    const description=p.text||p.why||'';
    const spells=p.spells?`<div class="g-spells">${p.spells.map(s=>`<img src="${I(s)}" alt="">`).join('')}</div>`:'';
    document.getElementById('guideDialogBody').innerHTML=`${spells}<p>${description}</p>`;
    dialog.showModal();
  };
  const showCategory=()=>{
    const group=categories.find(x=>x[0]===select.value);
    items.innerHTML=group[2].map((p,i)=>`<button class="g-item" data-entry="${i}"><img src="${I(p.icon)}" alt=""><span class="t"><b>${p.name}</b><span>${clean(p.why||p.text).slice(0,145)}</span></span></button>`).join('');
    items.querySelectorAll('[data-entry]').forEach(btn=>btn.onclick=()=>openEntry(group[2][+btn.dataset.entry]));
  };
  select.onchange=showCategory;
  showCategory();
  const ru=lang==='ru';
  document.getElementById('guideSources').textContent=ru?'Источники':'Sources';
  document.getElementById('guideSources').onclick=()=>{
    document.getElementById('guideDialogTitle').textContent=ru?'Источники и примечания':'Sources and notes';
    document.getElementById('guideDialogBody').innerHTML=`<p>${ru?'Гайд сверяется с WotLK-руководствами; детали талантов и макросов могут отличаться на отдельных серверах 3.3.5a.':'This guide is cross-checked against WotLK guides; talent and macro details may vary on individual 3.3.5a realms.'}</p><p><a class="tal-link" href="https://www.wowhead.com/wotlk/guide/classes/warrior/fury/dps-rotation-cooldowns-abilities-pve" target="_blank" rel="noreferrer">Wowhead · rotation</a></p><p><a class="tal-link" href="https://www.icy-veins.com/wotlk-classic/fury-warrior-dps-pve-rotation-cooldowns-abilities" target="_blank" rel="noreferrer">Icy Veins · priorities</a></p>`;
