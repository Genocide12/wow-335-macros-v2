<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гайд — WoW 3.3.5 Fury</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .g-layout { grid-template-columns: 1.1fr 1fr; grid-template-rows: 1fr; }
  .g-scroll { overflow-y: auto; padding-right: 4px; }
  .phase { border-left: 3px solid var(--gold); padding: 2px 0 2px 14px; margin-bottom: 13px; }
  .phase b.ph { color: var(--gold2); font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .phase b.ph img { width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto; }
  .phase .row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 7px; }
  .phase .row img { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); }
  .phase p { font-size: 12.8px; color: var(--txt); line-height: 1.5; margin-top: 6px; }
  .phase p b { color: var(--gold2); }
  .rot { display: flex; flex-direction: column; gap: 8px; }
  .rot-step { display: flex; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .rot-step img { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; }
  .rot-step .t b { font-size: 13px; display: block; }
  .rot-step .t span { font-size: 11.5px; color: var(--dim); }
  h3.sec { font-size: 14px; color: var(--gold2); margin: 4px 0 8px; }
  h3.sec:not(:first-child) { margin-top: 16px; }
  .tal-link { display: inline-flex; align-items: center; gap: 6px; color: var(--gold2); }
</style>
</head>
<body>
<div id="app">
<main>
  <div class="grid g-layout">
    <section class="card g-scroll" id="left"></section>
    <section class="card g-scroll" id="right"></section>
  </div>
</main>
</div>
<script src="assets/js/app.js"></script>
<script>
(() => {
  const lang = window.W.lang;
  const I = window.W.icon;
  const R = {
    title: 'Бой и выживание',
    subtitle: 'Воин · Неистовство · WotLK 3.3.5a. Как драться, выживать и выжать из персонажа максимум.',
    fightTitle: 'Как драться',
    fight: [
      { icon: 'ability_warrior_charge', name: 'Открывай Рывком',
        spells: ['ability_warrior_charge', 'ability_warrior_battleshout', 'ability_racial_bloodrage'],
        text: 'Каждый бой начинай с <b>Рывка</b> — макрос Q вне боя сам встанет в боевую стойку и рванёт к цели, а пока летишь, ярость уже копится. <b>Боевой крик</b> обновляй по <b>Alt+Q</b>, когда иконка баффа начала мигать: в бою игра запрещает макросам кастовать из Lua-кода, поэтому крик живёт на кнопке, а не в автоматике.' },
      { icon: 'inv_axe_66', name: 'Ротация — спамь Q',
        spells: ['ability_warrior_devastate', 'spell_nature_bloodlust', 'ability_whirlwind'],
        text: 'Приоритеты зашиты в порядок строк макроса: <b>Победный раж</b> (бесплатный, доступен лишь 20 сек после убийства — жми сразу, окно сгорает) → <b>Кровожадность</b> (ядро ротации, КД 4 сек) → <b>Вихрь</b> → <b>Казнь</b>. За одно нажатие срабатывает первый доступный удар.' },
      { icon: 'ability_racial_bloodrage', name: 'Ярость — не копи',
        spells: ['ability_rogue_ambush'],
        text: 'Ярость капает с ударов и полученного урона, на максимуме сгорает зря. Избыток сбрасывай <b>Ударом героя</b> (Alt+1) — он не занимает общий КД. <b>Кровавая ярость</b> не вшита в ротацию: используй её вручную, когда нужен дополнительный запас ярости.' },
      { icon: 'ability_parry', name: 'Стой за спиной',
        spells: ['ability_parry', 'ability_backstab'],
        text: 'Спереди моб может <b>парировать и уклоняться</b> от твоих ударов — обходи цель со спины, урон будет ровнее. И не убегай от мобов спиной: удары в спину <b>оглушают</b> и не дают оторваться.' },
      { icon: 'ability_whirlwind', name: 'Пак — жми E',
        spells: ['ability_whirlwind', 'ability_warrior_cleave', 'ability_warrior_warcry'],
        text: 'Два и больше мобов — E вместо Q: <b>Вихрь</b> бьёт всех вокруг обоими оружиями, <b>Рассекающий удар</b> превращает каждый свинг в удар по всем, а <b>Перехват</b> сам догоняет разбежавшихся. Против пары целей чередуй Q и E.' },
      { icon: 'spell_shadow_deathpact', name: 'Бурст на боссах',
        spells: ['spell_shadow_deathpact', 'ability_criticalstrike', 'inv_sword_48'],
        text: '<b>Alt+2</b> — Жажда смерти и аксессуар: нажимай вручную, когда готов к бурсту. <b>Alt+1</b> — Безрассудство: активируй вручную перед важным окном урона. Идеально под <b>Казнь</b> (цель ниже 20% HP) — так каждый крит на счету.' },
    ],
    survTitle: 'Как выживать',
    surv: [
      { icon: 'spell_nature_reincarnation', name: 'Лечение в бою',
        text: '<b>Кровожадность</b> лечит по своему эффекту. Талант <b>Безудержное восстановление</b> требует эффекта ярости: используй его вручную только когда нужно лечение и проверь, что эффект уже действует.' },
      { icon: 'ability_warrior_warcry', name: 'Профилактика урона',
        text: '<b>Деморализующий крик</b> снижает силу атаки мобов — против больших паков кричи его вручную (правило игры: в бою макрос не может проверить дебафф и скастовать сам). А прижало — Alt+R: оборонительная стойка режет входящий урон.' },
      { icon: 'ability_golemthunderclap', name: 'Контроль и побег',
        text: '<b>Alt+E — Устрашающий крик</b> распугает мобов вокруг. Талант <b>Пронзительный вой</b> замедлит погоню. Сначала распугай или замедли — потом беги к дружественным NPC или из зоны мобов.' },
      { icon: 'spell_shadow_charm', name: 'Аварийная кнопка',
        text: '<b>Alt+R</b>: Каждый за себя (раса «человек») снимет оглушение, страх и прочий контроль, а Оборонительная стойка режет получаемый урон на 10%. Выбрался — жми Q: макрос сам вернёт стойку берсерка.' },
      { icon: 'spell_misc_food', name: 'Между боями',
        text: 'Еда восстанавливает здоровье и даёт бонус к стату, <b>Первая помощь</b> — быстрые бинты из ткани. Не лезь в следующий бой с пустой полосой: смерть стоит дороже короткого перекура.' },
    ],
    rotTitle: 'Приоритет макроса Q (каждое нажатие запускает одно доступное действие)',
    rot: [
      { icon: 'ability_warrior_devastate', name: 'Победный раж', why: 'бесплатно, окно 20 сек после убийства — жми первым' },
      { icon: 'spell_nature_bloodlust', name: 'Кровожадность', why: 'КД 4 сек — ядро ротации, ещё и лечит' },
      { icon: 'ability_whirlwind', name: 'Вихрь', why: 'КД 10 сек (8 с талантом), бьёт обоими оружиями' },
      { icon: 'inv_sword_48', name: 'Казнь', why: 'под 20% HP цели; по гайдам WotLK — последний приоритет: у Кровожадности лучше скейлинг' },
      { icon: 'ability_rogue_ambush', name: 'Удар героя (Alt+1)', why: 'сброс лишней ярости, не в общем КД' },
    ],
    auto: [
      { icon: 'ability_warrior_battleshout', name: 'Боевой крик', why: 'обновляй вручную после окончания баффа — макрос не проверяет ауры' },
      { icon: 'ability_racial_avatar', name: 'Стойки', why: 'макрос переключает стойку по условию боя; вне боя использует Рывок' },
      { icon: 'ability_racial_bloodrage', name: 'Кровавая ярость', why: 'нажимай вручную, когда нужен дополнительный запас ярости' },
    ],
    learnTitle: 'Что и где изучать',
    learn: [
      { icon: 'ability_warrior_weaponmastery', name: 'Классовый тренер',
        text: 'Умения и их новые ранги покупаются у <b>тренера воинов</b> в столице. У большинства ударов несколько рангов — устаревший бьёт заметно слабее. Проверяй тренера каждый раз, как оказался в городе.' },
      { icon: 'ability_racial_avatar', name: 'Таланты',
        text: 'Все очки — в <b>Неистовство</b>: Безжалостность → Кровожадность → Прилив крови → Буйство. Собери билд мышкой на вкладке <a class="tal-link" href="talents.html?lang=ru">Таланты</a> — там же готовые пресеты.' },
      { icon: 'spell_shadow_charm', name: 'Расовые способности',
        text: 'За человека: <b>Каждый за себя</b> — снимает эффекты потери контроля, кулдаун 2 минуты. Жми Alt+R, когда тебя оглушили, испугали или обездвижили.' },
      { icon: 'inv_sword_20', name: 'Навык оружия',
        text: 'У каждого типа оружия свой навык: взял в руки незнакомый тип — начнутся промахи. Прокачай навык на манекене в столице или парой ударов по слабым мобам, прежде чем идти в бой.' },
      { icon: 'inv_shoulder_22', name: 'Экипировка',
        text: 'Ищи <b>силу</b> (сила атаки), <b>меткость</b> (особые удары перестают промахиваться) и <b>крит</b> (поддерживает Буйство). Два одноручных оружия дают ровную ярость и стабильный урон. Источники: данжи, групповые квесты, крафт, аукцион.' },
      { icon: 'spell_nature_enchantarmor', name: 'Усиления',
        text: '<b>Зачарования и камни</b> — даже дешёвые лучше никаких: сила и меткость на всё подряд. Еда со статом, зелья лечения на крайний случай, эликсиры — в данжи.' },
    ],
  };
  const E = {
    title: 'Combat & Survival',
    subtitle: 'Warrior · Fury · WotLK 3.3.5a. How to fight, stay alive and squeeze the maximum out of your character.',
    fightTitle: 'How to fight',
    fight: [
      { icon: 'ability_warrior_charge', name: 'Open with Charge',
        spells: ['ability_warrior_charge', 'ability_warrior_battleshout', 'ability_racial_bloodrage'],
        text: 'Start every fight with <b>Charge</b> — out of combat macro Q swaps you to Battle Stance and charges in, and rage builds while you fly. Refresh <b>Battle Shout</b> with <b>Alt+Q</b> when its icon starts blinking: in combat the game forbids macros from casting via Lua code, so the shout lives on a button instead of automation.' },
      { icon: 'inv_axe_66', name: 'Rotation — spam Q',
        spells: ['ability_warrior_devastate', 'spell_nature_bloodlust', 'ability_whirlwind'],
        text: 'Priorities are baked into the order of macro Q lines: <b>Victory Rush</b> (free, available for only 20 sec after a kill — fire it before the window closes) → <b>Bloodthirst</b> (the core, 4s CD) → <b>Whirlwind</b> → <b>Execute</b>. One press fires the first available strike.' },
      { icon: 'ability_racial_bloodrage', name: 'Don\u2019t cap rage',
        spells: ['ability_rogue_ambush'],
        text: 'Rage builds from your swings and from damage taken, and burns pointlessly at the cap. Dump the surplus into <b>Heroic Strike</b> (Alt+1) — it sits off the global cooldown. <b>Bloodrage</b> is not triggered automatically; use it manually when you need extra rage.' },
      { icon: 'ability_parry', name: 'Fight from behind',
        spells: ['ability_parry', 'ability_backstab'],
        text: 'From the front the mob can <b>parry and dodge</b> your attacks — circle behind the target for smoother damage. And don\u2019t run with your back to mobs: blows to the back <b>daze</b> you and let them keep up.' },
      { icon: 'ability_whirlwind', name: 'Packs — press E',
        spells: ['ability_whirlwind', 'ability_warrior_cleave', 'ability_warrior_warcry'],
        text: 'Two or more mobs — E instead of Q: <b>Whirlwind</b> hits everything around with both weapons, <b>Cleave</b> turns every white swing into a hit on all of them, and <b>Intercept</b> chases down runners on its own. On exactly two targets alternate Q and E.' },
      { icon: 'spell_shadow_deathpact', name: 'Burst on bosses',
        spells: ['spell_shadow_deathpact', 'ability_criticalstrike', 'inv_sword_48'],
        text: '<b>Alt+2</b> — Death Wish and trinket: activate manually before a damage window. <b>Alt+1</b> — Recklessness: activate manually before a burst window. The macro cannot check whether buffs have expired, so choose the timing yourself. Perfect under <b>Execute</b> range — every crit counts.' },
    ],
    survTitle: 'How to survive',
    surv: [
      { icon: 'spell_nature_reincarnation', name: 'Healing in combat',
        text: '<b>Bloodthirst</b> heals according to its own effect. The <b>Enraged Regeneration</b> talent requires an enrage effect: activate it manually when healing is needed and verify the required effect is active.' },
      { icon: 'ability_warrior_warcry', name: 'Damage prevention',
        text: '<b>Demoralizing Shout</b> lowers mob attack power — shout it by hand against big packs (a game rule: in combat a macro cannot check a debuff and cast it for you). Cornered? Alt+R: Defensive Stance cuts incoming damage.' },
      { icon: 'ability_golemthunderclap', name: 'Control and escape',
        text: '<b>Alt+E — Intimidating Shout</b> scares the mobs around. The <b>Piercing Howl</b> talent slows the chase. Fear or slow first — then run to friendly NPCs or out of the mob zone.' },
      { icon: 'spell_shadow_charm', name: 'Emergency button',
        text: '<b>Alt+R</b>: Every Man for Himself (human racial) breaks stuns, fears and other loss-of-control effects, and Defensive Stance cuts damage taken by 10%. Once you are safe press Q — the macro swaps you back to Berserker Stance.' },
      { icon: 'spell_misc_food', name: 'Between fights',
        text: 'Food restores health and adds a stat bonus, <b>First Aid</b> gives quick bandages from cloth. Don\u2019t pull the next mob on an empty bar: death costs more than a short break.' },
    ],
    rotTitle: 'Macro Q priority (one available action per press)',
    rot: [
      { icon: 'ability_warrior_devastate', name: 'Victory Rush', why: 'free, 20-sec window after a kill — press it first' },
      { icon: 'spell_nature_bloodlust', name: 'Bloodthirst', why: '4s CD — the core of the rotation, heals too' },
      { icon: 'ability_whirlwind', name: 'Whirlwind', why: '10s CD (8 with talent), both weapons' },
      { icon: 'inv_sword_48', name: 'Execute', why: 'under 20% target HP; per WotLK guides the lowest priority — Bloodthirst scales better' },
      { icon: 'ability_rogue_ambush', name: 'Heroic Strike (Alt+1)', why: 'rage dump, off GCD' },
    ],
    auto: [
      { icon: 'ability_warrior_battleshout', name: 'Battle Shout', why: 'refresh manually after expiry; the macro cannot inspect auras' },
      { icon: 'ability_racial_avatar', name: 'Stances', why: 'the macro chooses a stance from combat conditions; Charge out of combat' },
      { icon: 'ability_racial_bloodrage', name: 'Bloodrage', why: 'press manually when you need extra rage' },
    ],
    learnTitle: 'What & where to learn',
    learn: [
      { icon: 'ability_warrior_weaponmastery', name: 'Class trainer',
        text: 'Abilities and their new ranks are bought from the <b>warrior trainer</b> in a capital city. Most strikes have several ranks — an outdated one hits noticeably weaker. Check the trainer every time you are in town.' },
      { icon: 'ability_racial_avatar', name: 'Talents',
        text: 'Put every point into <b>Fury</b>: Cruelty → Bloodthirst → Bloodsurge → Rampage. Build it with your mouse on the <a class="tal-link" href="talents.html?lang=en">Talents</a> tab — ready presets are there too.' },
      { icon: 'spell_shadow_charm', name: 'Racial abilities',
        text: 'As a human: <b>Every Man for Himself</b> — breaks loss-of-control effects on a 2-minute cooldown. Press Alt+R when stunned, feared or rooted.' },
      { icon: 'inv_sword_20', name: 'Weapon skill',
        text: 'Every weapon type has its own skill: picked up an unfamiliar type — misses begin. Train it on a capital-city dummy or with a couple of hits on weak mobs before fighting for real.' },
      { icon: 'inv_shoulder_22', name: 'Gear',
        text: 'Look for <b>strength</b> (attack power), <b>hit rating</b> (specials stop missing) and <b>crit</b> (feeds Rampage). Two one-handers give smooth rage and steady damage. Sources: dungeons, group quests, crafting, the auction house.' },
      { icon: 'spell_nature_enchantarmor', name: 'Upgrades',
        text: '<b>Enchants and gems</b> — even cheap ones beat none: strength and hit on everything. Stat food, healing potions for emergencies, elixirs for dungeons.' },
    ],
  };
  const D = lang === 'ru' ? R : E;
  document.title = D.title + ' — WoW 3.3.5 Fury';

  const block = p => `
    <div class="phase">
      <b class="ph"><img src="${I(p.icon)}" alt="">${p.name}</b>
      ${p.spells ? `<div class="row">${p.spells.map(s => `<img src="${I(s)}" alt="">`).join('')}</div>` : ''}
      <p>${p.text}</p>
    </div>`;

  document.getElementById('left').innerHTML = `
    <h2>${D.title}</h2>
    <p class="muted small" style="margin-bottom:12px">${D.subtitle}</p>
    <h3 class="sec">${D.fightTitle}</h3>
    ${D.fight.map(block).join('')}
    <h3 class="sec">${D.survTitle}</h3>
    ${D.surv.map(block).join('')}`;

  const rotStep = r => `
    <div class="rot-step"><img src="${I(r.icon)}" alt="">
      <div class="t"><b>${r.name}</b><span>${r.why}</span></div></div>`;

  document.getElementById('right').innerHTML = `
    <h3 class="sec">${D.rotTitle}</h3>
    <div class="rot">${D.rot.map(rotStep).join('')}</div>
    <div class="rot" style="margin-top:8px">${D.auto.map(rotStep).join('')}</div>
    <h3 class="sec">${D.learnTitle}</h3>
    ${D.learn.map(block).join('')}`;
})();
</script>
</body>
</html>
