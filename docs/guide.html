<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гайд — WoW 3.3.5 Fury</title>
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .g-shell{min-height:0;flex:1;display:flex;flex-direction:column;gap:10px;overflow:hidden}

  .g-head h2{margin:0;color:var(--gold2);font-size:18px}
  .g-head p{font-size:11px;color:var(--dim);margin-top:3px}
  .g-select{margin-left:auto;max-width:270px;background:#11141d;color:var(--gold2);border:1px solid var(--gold);border-radius:9px;padding:9px;font-weight:700}
  .g-items{position:relative;isolation:isolate;flex:1;min-height:0;overflow:hidden;border:1px solid #5b4a2b;border-radius:14px;background:radial-gradient(circle at center,#252331 0,#141720 34%,#0c0f17 75%);box-shadow:inset 0 0 42px #000a,0 8px 25px #0006}

  .g-center img{width:48%;height:48%;object-fit:cover;border-radius:50%;filter:drop-shadow(0 0 9px #e8c96a66)}
  .g-item{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:clamp(70px,8vw,92px);aspect-ratio:1;transform:translate(-50%,-50%);padding:5px;background:linear-gradient(145deg,#292b35,#10131b);color:var(--txt);border:1px solid #817044;border-radius:50%;cursor:pointer;overflow:hidden;box-shadow:0 5px 18px #0009,inset 0 0 0 2px #ffffff07;transition:transform .18s,border-color .18s,box-shadow .18s}
  .g-item:hover,.g-item:focus-visible{transform:translate(-50%,-50%) scale(1.09);border-color:var(--gold2);box-shadow:0 0 23px #d6b86166,inset 0 0 0 2px #ffffff12;outline:none}
  .g-item img{width:42%;aspect-ratio:1;border:1px solid #c8a951;border-radius:9px;flex:0 0 auto;box-shadow:0 0 10px #000b}
  .g-item b{display:block;width:100%;color:#fff;font-size:clamp(8px,.9vw,11px);line-height:1.1;text-align:center}
  .g-tooltip{display:none;position:fixed;z-index:110;width:min(330px,calc(100vw - 20px));max-height:min(60dvh,390px);overflow:auto;padding:12px;background:#10131beF;border:1px solid var(--gold);border-radius:11px;box-shadow:0 14px 45px #000d;color:#ddd8cc;font-size:12px;line-height:1.45;pointer-events:none}
  .g-tooltip.on{display:block;animation:tip-in .12s ease-out}@keyframes tip-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .g-tooltip strong{display:block;color:var(--gold2);font-size:13px;margin-bottom:6px}.g-tooltip p{margin:0}.g-tooltip .g-spells{margin:6px 0}
  .g-bottom{display:flex;justify-content:flex-end}
  .g-dialog{width:min(720px,92vw);max-height:82dvh;margin:auto;padding:0;background:#141720;color:var(--txt);border:1px solid var(--gold);border-radius:14px;box-shadow:0 20px 70px #000d}

  .g-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--gold2);font-weight:800}
  .g-dialog-head button{background:none;border:0;color:var(--dim);font-size:24px;cursor:pointer}
  .g-dialog-body{padding:14px 16px;overflow:auto;max-height:calc(82dvh - 52px);font-size:13px;line-height:1.55}
  .g-dialog-body p{margin:8px 0}.g-dialog-body b{color:var(--gold2)}
  .g-spells{display:flex;gap:6px;flex-wrap:wrap}.g-spells img{width:42px;height:42px;border:1px solid #5c4b2b;border-radius:8px}
  @media(max-width:860px){.g-shell{gap:6px}.g-head h2{font-size:15px}.g-select{max-width:48%;padding:7px;font-size:11px}.g-orbit{width:min(78%,min(54vh,460px))}.g-item{width:clamp(64px,12vw,82px)}}
  @media(max-width:420px){.g-select{max-width:50%}.g-orbit{width:min(82%,min(48vh,380px))}.g-item{width:68px}.g-center{width:70px}}
</style>
</head>

  const D = lang === 'ru' ? R : E;

      {icon:'ability_warrior_punishingblow',name:lang==='ru'?'Контроль и прерывания':'Control & interrupts',spells:['ability_warrior_punishingblow','ability_warrior_disarm','inv_gauntlets_04'],text:lang==='ru'?'Зуботычину используй на опасном касте, Разоружение — против физического бурста. Фокус-макрос помогает не терять основную цель.':'Use Pummel on dangerous casts and Disarm against melee burst. Focus macros let you keep your main target.'},
      {icon:'spell_nature_ancestralguardian',name:lang==='ru'?'Ответ на контроль':'Break control',spells:['spell_nature_ancestralguardian','ability_warrior_defensivestance'],text:lang==='ru'?'Ярость берсерка оставь под страх; Стойку и защитные кулдауны переключай осознанно. Не сливай их автоматически одним макросом.':'Save Berserker Rage for fear; use stance and defensive cooldowns deliberately instead of firing them blindly from one macro.'},
      {icon:'ability_warrior_bladestorm',name:lang==='ru'?'Окно бурста':'Burst window',spells:['ability_warrior_bladestorm','ability_criticalstrike','inv_sword_48'],text:lang==='ru'?'Подготовь цель замедлением и дебаффом лечения. Вихрь клинков и аксессуары используй, когда цель не может просто выйти из зоны или закрыться защитой.':'Set up with a slow and healing debuff. Use Bladestorm and trinkets when the target cannot easily escape or answer with a defensive.'}
    ]:[
      {icon:'ability_warrior_shieldslam',name:lang==='ru'?'Одиночная угроза':'Single-target threat',spells:['ability_warrior_shieldslam','ability_warrior_revenge','ability_warrior_devastate'],text:lang==='ru'?'Поддерживай Удар щитом и Реванш по готовности, заполняй паузы Сокрушением. Следи за яростью и угрозой; макрос не заменит оценку агро.':'Use Shield Slam and Revenge when ready, filling gaps with Devastate. Watch rage and threat; macros do not judge aggro.'},

      {icon:'spell_nature_reincarnation',name:lang==='ru'?'Провокация и помощь группе':'Taunt & group utility',spells:['spell_nature_reincarnation','ability_warrior_intervene','ability_warrior_vigilance'],text:lang==='ru'?'Провокацию по наведению используй для перехвата конкретной цели. Проверяй, что курсор над нужным врагом; для группы назначай Бдительность и помогай Перехватом.':'Use mouseover Taunt to recover a specific mob. Confirm the cursor target; assign Vigilance and Intervene to support the group.'},

  const openEntry=(p)=>{
    document.getElementById('guideDialogTitle').textContent=p.name;

    guideTooltip.classList.add('on');
    const r=btn.getBoundingClientRect(),w=guideTooltip.offsetWidth,h=guideTooltip.offsetHeight;
    let left=r.right+12;if(left+w>innerWidth-8)left=r.left-w-12;
    let top=Math.max(8,Math.min(innerHeight-h-8,r.top+(r.height-h)/2));
    guideTooltip.style.left=`${Math.max(8,left)}px`;guideTooltip.style.top=`${top}px`;
  };
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.g-item,.g-tooltip'))guideTooltip.classList.remove('on');});
  const layoutWheel=()=>{
    const buttons=[...items.querySelectorAll('.g-item')],w=items.clientWidth,h=items.clientHeight;
    const cx=w/2,cy=h/2,r=Math.max(40,Math.min(w,h)*.37);
    buttons.forEach((btn,i)=>{const angle=-Math.PI/2+2*Math.PI*i/buttons.length;btn.style.left=`${cx+Math.cos(angle)*r}px`;btn.style.top=`${cy+Math.sin(angle)*r}px`;});
  };
  const showCategory=()=>{
    const group=categories.find(x=>x[0]===select.value);
    items.innerHTML=`<div class="g-orbit"></div><div class="g-center"><img src="${I('ability_racial_avatar')}" alt=""></div>`+group[2].map((p,i)=>`<button class="g-item" data-entry="${i}" aria-label="${p.name}"><img src="${I(p.icon)}" alt=""><b>${p.name}</b></button>`).join('');
    layoutWheel();
    items.querySelectorAll('[data-entry]').forEach(btn=>{
      const entry=group[2][+btn.dataset.entry];

      let lastPointer='mouse';btn.onpointerdown=e=>{lastPointer=e.pointerType;};
      btn.onclick=()=>{if(lastPointer==='touch'||lastPointer==='pen'){showTooltip(entry,btn);return;}openEntry(entry);};

  new ResizeObserver(layoutWheel).observe(items);

    document.getElementById('guideDialogTitle').textContent=ru?'Источники и примечания':'Sources and notes';
    document.getElementById('guideDialogBody').innerHTML=`<p>${ru?'Гайд сверялся с несколькими руководствами по Fury PvE, Arms PvP и Protection PvE. Для конкретного сервера 3.3.5a проверь названия рангов, локализацию и доступные способности.':'Cross-checked against multiple Fury PvE, Arms PvP, and Protection PvE guides. Check spell ranks, localization, and available abilities on your specific 3.3.5a realm.'}</p>
      <p><a class="tal-link" href="https://www.wowhead.com/wotlk/guide/classes/warrior/fury/dps-rotation-cooldowns-abilities-pve" target="_blank" rel="noreferrer">Wowhead · Fury DPS</a></p>
      <p><a class="tal-link" href="https://www.warcrafttavern.com/wotlk/guides/pve-fury-warrior-rotation-cooldowns/" target="_blank" rel="noreferrer">Warcraft Tavern · Fury rotation and cooldowns</a></p>
      <p><a class="tal-link" href="https://www.icy-veins.com/wotlk-classic/fury-warrior-dps-pve-rotation-cooldowns-abilities" target="_blank" rel="noreferrer">Icy Veins · Fury priorities</a></p>
      <p><a class="tal-link" href="https://www.warcrafttavern.com/wotlk/guides/pvp-arms-warrior-rotation-cooldowns-abilities/" target="_blank" rel="noreferrer">Warcraft Tavern · Arms PvP</a></p>
      <p><a class="tal-link" href="https://www.warcrafttavern.com/wotlk/guides/pve-protection-warrior-tank-rotations-cooldowns/" target="_blank" rel="noreferrer">Warcraft Tavern · Protection Tank</a></p>
      <p><a class="tal-link" href="https://www.icy-veins.com/wotlk-classic/protection-warrior-tank-pve-guide" target="_blank" rel="noreferrer">Icy Veins · Protection Tank</a></p>`;

  };
