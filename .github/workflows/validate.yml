name: Validate macros and talent presets

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build localized installers and site data
        run: python scripts/build.py
      - name: Validate macros
        run: python scripts/validate.py
      - name: Rebuild and confirm generated outputs
        run: |
          python scripts/build.py
          python scripts/validate.py
          git diff --exit-code -- install/macros-cache-ru.txt install/macros-cache-en.txt docs/assets/js/macros-data.js
      - name: Validate talent presets
        run: python scripts/check_talents.py
      - name: Check essential Pages files
        run: |
          test -f docs/index.html
          test -f docs/macros.html
          test -f docs/hero.html
          test -f docs/talents.html
          test -f docs/assets/icons/bg/164.jpg
          grep -q 'Боевые кнопки' docs/index.html
          grep -q 'UnitBuff' docs/macros.html
