name: Validate macros

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - run: git diff --exit-code -- install/macros-cache-ru.txt install/macros-cache-en.txt docs/assets/js/macros-data.js
