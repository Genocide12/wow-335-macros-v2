name: Validate macros

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - run: git diff --exit-code -- install/macros-cache-ru.txt install/macros-cache-en.txt docs/assets/js/macros-data.js
      - name: Check README page content and screenshots
        run: |
          test -f docs/index.html
          test -f docs/assets/shots/home.png
          test -f docs/assets/shots/macros.png
          test -f docs/assets/shots/talents.png
          test -f docs/assets/shots/guide.png
          test -f docs/assets/shots/hero.png
          grep -q 'releases/latest' README.md
          grep -q '## About' README.md
          grep -q '## About' README.en.md
          grep -q 'wow-335-macros-v2/releases' docs/assets/js/app.js
